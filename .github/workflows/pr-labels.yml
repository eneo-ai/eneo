name: PR label policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, labeled, unlabeled, enqueued]
  merge_group:
    types: [checks_requested]

# Use the default branch's policy for every target, including older releases.
# This job only reads GitHub metadata. It never runs code from a PR or a queue
# candidate and needs neither a PAT nor write permissions.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-labels-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  labels:
    name: PR labels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted label policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Validate current PR labels
        run: node .github/scripts/check-pr-labels.mjs
        env:
          GH_TOKEN: ${{ github.token }}
