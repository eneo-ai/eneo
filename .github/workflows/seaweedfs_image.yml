name: SeaweedFS Image

# Builds, verifies, and publishes the Eneo-built SeaweedFS object-content image.
#
# The image inputs are fully pinned (upstream source archive, downstream patch,
# compiler image, runtime image), so the build is reproducible and only needs to
# run when those inputs, this workflow, or the reference Compose files the smoke
# test exercises change. The application images have their own workflow and are
# never blocked by this one.
#
# - Push to develop touching the inputs: full build, verification, attestation,
#   and publication of ghcr.io/eneo-ai/eneo-seaweedfs:<docker/seaweedfs/VERSION>.
# - Pull requests and manual runs from other branches: the same build, smoke
#   test, SBOM, and vulnerability gate against an ephemeral local registry with
#   read-only permissions; nothing reaches GHCR and nothing is attested.
# - Weekly schedule: re-audit the pinned source and the published platform
#   digests against the current Go and Grype vulnerability databases.

on:
  push:
    branches:
      - develop
    paths:
      - docker/seaweedfs/**
      - docs/deployment/docker-compose.yml
      - docs/deployment/docker-compose.object-content.yml
      - .github/actions/seaweedfs-platform-check/**
      - .github/workflows/seaweedfs_image.yml
  pull_request:
    paths:
      - docker/seaweedfs/**
      - docs/deployment/docker-compose.yml
      - docs/deployment/docker-compose.object-content.yml
      - .github/actions/seaweedfs-platform-check/**
      - .github/workflows/seaweedfs_image.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eneo-ai/eneo-seaweedfs
  BUILDX_VERSION: v0.33.0
  BUILDKIT_IMAGE: moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  SOURCE_DATE_EPOCH: "1784519823"
  GRYPE_VERSION: v0.117.0
  SYFT_VERSION: v1.44.0

jobs:
  source-policy:
    name: SeaweedFS source policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve image version and publication mode
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <docker/seaweedfs/VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+-eneo\.[0-9]+$ ]]

          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/develop" \
            && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
            publish=true
          fi

          {
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"
          echo "SeaweedFS image version $version, publish=$publish"

      - name: Verify pinned source, licenses, and reachable vulnerabilities
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: docker/seaweedfs/verify-supply-chain.sh source seaweedfs-source-evidence

      - name: Upload source policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-source-evidence
          path: seaweedfs-source-evidence/*
          if-no-files-found: error
          retention-days: 14

  platform-audit:
    name: Audit SeaweedFS ${{ matrix.platform }}
    needs: source-policy
    if: needs.source-policy.outputs.publish != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      registry:
        image: docker.io/library/registry:3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        ports:
          - 5000:5000
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            curl_image: docker.io/curlimages/curl@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
          - platform: linux/arm64
            slug: linux-arm64
            curl_image: docker.io/curlimages/curl@sha256:b949ec80877077def1544f0727d3e3101dd687fe20a5bf74997e557f7e3ac961

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for the emulated arm64 build
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }},network=host

      - name: Build, smoke test, and gate the candidate against the local registry
        uses: ./.github/actions/seaweedfs-platform-check
        with:
          image: localhost:5000/eneo-seaweedfs
          platform: ${{ matrix.platform }}
          slug: ${{ matrix.slug }}
          curl-image: ${{ matrix.curl_image }}
          version: ${{ needs.source-policy.outputs.version }}
          buildx-version: ${{ env.BUILDX_VERSION }}
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}
          source-date-epoch: ${{ env.SOURCE_DATE_EPOCH }}
          syft-version: ${{ env.SYFT_VERSION }}
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Upload audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-${{ matrix.slug }}-audit-evidence
          path: seaweedfs-${{ matrix.slug }}-evidence/*
          if-no-files-found: error
          retention-days: 14

  platform:
    name: SeaweedFS ${{ matrix.platform }}
    needs: source-policy
    if: needs.source-policy.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: object-content-supply-chain
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            curl_image: docker.io/curlimages/curl@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
          - platform: linux/arm64
            slug: linux-arm64
            curl_image: docker.io/curlimages/curl@sha256:b949ec80877077def1544f0727d3e3101dd687fe20a5bf74997e557f7e3ac961

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for the emulated arm64 build
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }},network=host

      - name: Log in to GHCR with the workflow identity
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke test, and gate the candidate by digest
        id: check
        uses: ./.github/actions/seaweedfs-platform-check
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          platform: ${{ matrix.platform }}
          slug: ${{ matrix.slug }}
          curl-image: ${{ matrix.curl_image }}
          version: ${{ needs.source-policy.outputs.version }}
          buildx-version: ${{ env.BUILDX_VERSION }}
          buildkit-image: ${{ env.BUILDKIT_IMAGE }}
          source-date-epoch: ${{ env.SOURCE_DATE_EPOCH }}
          syft-version: ${{ env.SYFT_VERSION }}
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Attest platform image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.check.outputs.digest }}
          push-to-registry: true

      - name: Attest the platform SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.check.outputs.digest }}
          sbom-path: seaweedfs-${{ matrix.slug }}-evidence/seaweedfs-${{ matrix.slug }}.spdx.json
          push-to-registry: true

      - name: Attest platform policy evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: seaweedfs-${{ matrix.slug }}-evidence/*

      - name: Upload platform policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-${{ matrix.slug }}-evidence
          path: seaweedfs-${{ matrix.slug }}-evidence/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish attested SeaweedFS manifest
    needs:
      - source-policy
      - platform
    if: needs.source-policy.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: object-content-supply-chain
    # One publisher at a time so the version-tag check below cannot race.
    concurrency:
      group: seaweedfs-image-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Download verified evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: seaweedfs-*-evidence
          path: seaweedfs-evidence
          merge-multiple: true

      - name: Verify both platform evidence sets survived the merge
        run: |
          set -euo pipefail
          for platform in linux-amd64 linux-arm64; do
            for evidence in \
              "DIGEST-$platform" \
              "grype-$platform.json" \
              "IMAGE-PROVENANCE-$platform.txt" \
              "IMAGE-SHA256SUMS-$platform" \
              "seaweedfs-$platform.cyclonedx.json" \
              "seaweedfs-$platform.spdx.json"; do
              test -s "seaweedfs-evidence/$evidence"
            done
          done

      - name: Log in to GHCR with the workflow identity
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested multi-platform manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.source-policy.outputs.version }}
        run: |
          set -euo pipefail

          amd64_digest="$(cat seaweedfs-evidence/DIGEST-linux-amd64)"
          arm64_digest="$(cat seaweedfs-evidence/DIGEST-linux-arm64)"
          image_ref="$IMAGE:$VERSION"

          # The version tag is immutable by policy: it may only ever point at
          # these reproducible platform digests. Different content needs a new
          # docker/seaweedfs/VERSION. Only a confirmed "not found" may create
          # the tag; any other registry error fails closed.
          state=""
          for attempt in 1 2 3; do
            if existing="$(docker buildx imagetools inspect "$image_ref" --raw 2>/tmp/inspect.err)"; then
              state=exists
              break
            elif grep -qiE 'not found|manifest unknown' /tmp/inspect.err; then
              state=absent
              break
            fi
            echo "registry inspection attempt $attempt failed:" >&2
            cat /tmp/inspect.err >&2
            sleep 10
          done
          [[ -n "$state" ]] || {
            echo "::error::Could not determine whether $image_ref exists; refusing to publish."
            exit 1
          }

          if [[ "$state" == exists ]]; then
            jq -e \
              --arg amd64 "$amd64_digest" \
              --arg arm64 "$arm64_digest" '
                ([.manifests[] | select(.platform.os == "linux") | .digest] | sort)
                  == ([$amd64, $arm64] | sort)
              ' <<<"$existing" >/dev/null || {
              echo "::error::$image_ref already exists with different content." \
                "Bump docker/seaweedfs/VERSION instead of moving a published tag."
              exit 1
            }
            echo "$image_ref already points at both verified platform digests; tag left untouched."
          else
            docker buildx imagetools create \
              --tag "$image_ref" \
              "$IMAGE@$amd64_digest" \
              "$IMAGE@$arm64_digest"
          fi

          docker buildx imagetools inspect "$image_ref" --raw \
            >seaweedfs-evidence/MANIFEST.json
          manifest_digest="$(docker buildx imagetools inspect "$image_ref" \
            --format '{{json .Manifest}}' | jq -r '.digest')"

          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" '
              (.manifests | length) == 2
              and any(.manifests[];
                .platform.os == "linux"
                and .platform.architecture == "amd64"
                and .digest == $amd64)
              and any(.manifests[];
                .platform.os == "linux"
                and .platform.architecture == "arm64"
                and .digest == $arm64)
            ' seaweedfs-evidence/MANIFEST.json >/dev/null

          {
            printf 'seaweedfs manifest %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$manifest_digest"
            printf 'seaweedfs linux/amd64 %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$amd64_digest"
            printf 'seaweedfs linux/arm64 %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$arm64_digest"
          } >seaweedfs-evidence/IMAGE-DIGESTS.txt
          (
            cd seaweedfs-evidence
            find . -maxdepth 1 -type f ! -name EVIDENCE-SHA256SUMS \
              -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
              >EVIDENCE-SHA256SUMS
          )

          {
            echo "image-ref=$image_ref"
            echo "manifest-digest=$manifest_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Attest multi-platform image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.manifest-digest }}
          push-to-registry: true

      - name: Attest source policy evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            seaweedfs-evidence/SOURCE-PROVENANCE.txt
            seaweedfs-evidence/SOURCE-SHA256SUMS
            seaweedfs-evidence/govulncheck.txt
            seaweedfs-evidence/licenses.csv

      - name: Independently verify registry provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.manifest-digest }}
        run: |
          set -euo pipefail

          signer_workflow="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/.github/workflows/seaweedfs_image.yml"
          common_flags=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$signer_workflow"
            --source-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
            --bundle-from-oci
          )

          gh attestation verify "oci://$IMAGE@$MANIFEST_DIGEST" \
            "${common_flags[@]}" \
            --predicate-type https://slsa.dev/provenance/v1
          for platform in linux-amd64 linux-arm64; do
            digest="$(cat "seaweedfs-evidence/DIGEST-$platform")"
            gh attestation verify "oci://$IMAGE@$digest" \
              "${common_flags[@]}" \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "oci://$IMAGE@$digest" \
              "${common_flags[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-publication-${{ needs.source-policy.outputs.version }}-${{ github.sha }}
          path: seaweedfs-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: SeaweedFS publication summary
        run: |
          {
            echo "## Eneo SeaweedFS reference image"
            echo ""
            echo "Published and independently verified:"
            echo ""
            sed 's/^/- `/' seaweedfs-evidence/IMAGE-DIGESTS.txt | sed 's/$/`/'
          } >>"$GITHUB_STEP_SUMMARY"

  audit-published:
    name: Re-audit published ${{ matrix.platform }}
    needs: source-policy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          - linux/arm64

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR with the workflow identity
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the published platform digest and check its version label
        id: digest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ needs.source-policy.outputs.version }}
          ARCH: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --raw | jq -er --arg arch "${ARCH#linux/}" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest][0]
          ')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$IMAGE@$digest" --format '{{json .Image}}' \
            | jq -e --arg version "$VERSION" \
              '.config.Labels["org.opencontainers.image.version"] == $version' >/dev/null
          echo "digest=$digest" >>"$GITHUB_OUTPUT"

      - name: Block new HIGH and CRITICAL vulnerabilities in the published image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.digest.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          grype-version: ${{ env.GRYPE_VERSION }}
