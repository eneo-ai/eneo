name: Application image security

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  published-images:
    name: Published image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: [eneo-backend, eneo-frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pull published image
        env:
          IMAGE: ghcr.io/eneo-ai/${{ matrix.image }}:develop
        run: docker pull "$IMAGE"
      - uses: ./.github/actions/scan-application-image
        with:
          image: ghcr.io/eneo-ai/${{ matrix.image }}:develop
          output-directory: ${{ runner.temp }}/image-security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-published-${{ matrix.image }}
          path: ${{ runner.temp }}/image-security/*.json
          retention-days: 14
