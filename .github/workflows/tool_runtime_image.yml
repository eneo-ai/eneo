name: Tool Runtime Image

# Tests, builds, scans, and publishes the optional bundled tool runtime
# (ghcr.io/eneo-ai/eneo-tool-runtime). It is a separate image with its own
# version (tool-runtime/VERSION), so the application images are never blocked
# by this workflow.
#
# - Pull requests and other branches: tests, typecheck, image build, SBOM and
#   vulnerability gate; nothing is pushed.
# - Push to develop: the same checks, then publication of
#   ghcr.io/eneo-ai/eneo-tool-runtime:<VERSION> with provenance and SBOM
#   attestations. A published version tag is never moved.

on:
  push:
    branches:
      - develop
    paths:
      - tool-runtime/**
      - .github/workflows/tool_runtime_image.yml
  pull_request:
    paths:
      - tool-runtime/**
      - .github/workflows/tool_runtime_image.yml
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: eneo-ai/eneo-tool-runtime
  BUILDX_VERSION: v0.33.0
  BUILDKIT_IMAGE: moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
  GRYPE_VERSION: v0.117.0

jobs:
  test:
    name: Tool runtime tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    defaults:
      run:
        working-directory: tool-runtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Resolve image version and publication mode
        id: version
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' <VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-eneo\.[0-9]+$ ]]
          publish=false
          if [[ "$GITHUB_REF" == "refs/heads/develop" \
            && ( "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ) ]]; then
            publish=true
          fi
          {
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

  image:
    name: Build ${{ needs.test.outputs.publish == 'true' && 'and publish ' || '' }}image
    needs: test
    runs-on: ubuntu-latest
    # One publisher at a time so the version-tag check below cannot race.
    concurrency:
      group: tool-runtime-image-${{ needs.test.outputs.publish }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      VERSION: ${{ needs.test.outputs.version }}
      PUBLISH: ${{ needs.test.outputs.publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build the scan candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: tool-runtime
          platforms: linux/amd64
          load: true
          tags: eneo-tool-runtime:candidate
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Smoke test the candidate
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          docker run -d --name tool-runtime --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e TOOL_RUNTIME_TOKEN="$token" -p 3010:3010 eneo-tool-runtime:candidate
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3010/health/ready >/dev/null && break
            sleep 1
          done
          body='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"run_javascript","arguments":{"code":"return input.reduce((a, b) => a + b, 0);","input":[1,2,39]}}}'
          curl -fsS http://127.0.0.1:3010/mcp/compute \
            -H "authorization: Bearer $token" \
            -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d "$body" | tee response.json
          jq -e '.result.structuredContent.ok == true and .result.structuredContent.result == 42' response.json
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3010/mcp/compute \
            -H 'content-type: application/json' -d "$body")"
          [[ "$status" == 401 ]]
          docker rm -f tool-runtime

      - name: Block HIGH and CRITICAL vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: eneo-tool-runtime:candidate
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: ${{ env.GRYPE_VERSION }}

      - name: Log in to GHCR with the workflow identity
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to move a published version tag
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$REGISTRY/$IMAGE_NAME:$VERSION" >/dev/null 2>/tmp/inspect.err; then
            echo "::error::$REGISTRY/$IMAGE_NAME:$VERSION already exists. Bump tool-runtime/VERSION."
            exit 1
          fi
          grep -qiE 'not found|manifest unknown' /tmp/inspect.err || {
            cat /tmp/inspect.err >&2
            echo "::error::Could not determine whether the tag exists; refusing to publish."
            exit 1
          }

      - name: Build and push multi-platform image
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: tool-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          build-args: |
            VERSION=${{ env.VERSION }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}

      - name: Attest image provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Publication summary
        if: env.PUBLISH == 'true'
        run: |
          echo "Published \`$REGISTRY/$IMAGE_NAME:$VERSION@${{ steps.push.outputs.digest }}\`" >>"$GITHUB_STEP_SUMMARY"
