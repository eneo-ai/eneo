name: PR user-facing notes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches:
      - develop
      - "release/**"
  # Report the required check as skipped for merge candidates. Each PR has
  # already passed this metadata check before entering the queue.
  merge_group:

permissions:
  contents: read
  pull-requests: read

# A newer push or body edit to a pull request replaces its older check. A merge
# candidate's run belongs to that run alone and is never cancelled or replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('user-facing-{0}-{1}', github.workflow, github.event.pull_request.number) || format('user-facing-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  user-facing:
    name: User-facing section
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check the current User-facing section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Read fresh metadata, including when an old run is manually retried.
          gh api "repos/$GH_REPO/pulls/$PR_NUMBER" > "$RUNNER_TEMP/pr.json"
          jq -r '.body // ""' "$RUNNER_TEMP/pr.json" > "$RUNNER_TEMP/pr-body.md"
          node .github/scripts/check-user-facing.mjs \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --author-type "$(jq -r '.user.type // "User"' "$RUNNER_TEMP/pr.json")"
