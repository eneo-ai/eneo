name: Application component image
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      backend_digest:
        default: ''
        type: string
    outputs:
      digest:
        value: ${{ jobs.image.outputs.digest }}
jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMPONENT: ${{ inputs.component }}
      VERSION: ${{ inputs.version }}
      REVISION: ${{ inputs.revision }}
      CANDIDATE: eneo-${{ inputs.component }}:candidate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Reuse only an attested image with matching source and version
        id: reuse
        run: python3 scripts/release_bundle.py reuse --component "$COMPONENT"
      - name: Inject backend version
        if: inputs.component == 'backend' && steps.reuse.outputs.exists != 'true'
        run: ./scripts/inject-backend-version.sh "$VERSION"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: inputs.component == 'frontend' && steps.reuse.outputs.exists != 'true'
        with:
          bun-version: 1.3.14
      - name: Prepare frontend from this release's backend
        if: inputs.component == 'frontend' && steps.reuse.outputs.exists != 'true'
        env:
          BACKEND_DIGEST: ${{ inputs.backend_digest }}
        run: |
          sudo fallocate -l 6G /mnt/eneo-frontend.swap
          sudo chmod 600 /mnt/eneo-frontend.swap
          sudo mkswap /mnt/eneo-frontend.swap
          sudo swapon /mnt/eneo-frontend.swap
          ./scripts/sync-frontend-with-backend.sh "ghcr.io/eneo-ai/eneo-backend@$BACKEND_DIGEST"
          test "$(jq -r .version frontend/apps/web/package.json)" = "$VERSION"
      # The candidate is built, scanned and exercised before anything reaches
      # the registry. The docker exporter cannot carry SBOM/provenance
      # attestations, so the publish step below rebuilds the same inputs from
      # this builder's cache and the layer check proves nothing else was pushed.
      - name: Build the scan candidate
        if: steps.reuse.outputs.exists != 'true'
        id: candidate
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./${{ inputs.component }}
          platforms: linux/amd64
          load: true
          tags: ${{ env.CANDIDATE }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            OTEL_SERVICE_VERSION=${{ inputs.version }}
            APP_VERSION=${{ inputs.version }}
            APP_REVISION=${{ inputs.revision }}
          cache-from: type=gha,scope=${{ inputs.component }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}
      - name: Scan the candidate
        if: steps.reuse.outputs.exists != 'true'
        uses: ./.github/actions/scan-application-image
        with:
          component: ${{ inputs.component }}
          image: ${{ env.CANDIDATE }}
          output-directory: ${{ runner.temp }}/image-security
      - name: Verify the candidate runtime
        if: steps.reuse.outputs.exists != 'true'
        run: ./scripts/check-application-image.sh "$COMPONENT" "$CANDIDATE"
      - name: Keep scanner reports and readable findings
        if: always() && steps.candidate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-publish-${{ inputs.component }}
          path: ${{ runner.temp }}/image-security/
          retention-days: 14
      - name: Publish the verified candidate with attestations
        if: steps.reuse.outputs.exists != 'true'
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: ./${{ inputs.component }}
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          tags: ghcr.io/eneo-ai/eneo-${{ inputs.component }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            OTEL_SERVICE_VERSION=${{ inputs.version }}
            APP_VERSION=${{ inputs.version }}
            APP_REVISION=${{ inputs.revision }}
          cache-from: type=gha,scope=${{ inputs.component }}
      - name: Refuse a published image whose layers differ from the scanned candidate
        if: steps.reuse.outputs.exists != 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/release_bundle.py published-matches --component "$COMPONENT" --candidate "$CANDIDATE" --digest "$DIGEST"
      - name: Attest component provenance
        if: steps.reuse.outputs.exists != 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-name: ghcr.io/eneo-ai/eneo-${{ inputs.component }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
