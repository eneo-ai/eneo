name: Build and Push Docker Images

# This workflow ONLY builds and pushes Docker images to GitHub Container Registry.
# Deployment is handled by external systems that watch for image updates.
#
# Workflow Summary:
# - develop branch → :develop image tag → external system deploys to dev (automatic)
# - v* tags → version image tags → external system handles production deployment (automatic)
# - Any other branch → manually triggered via Actions tab (workflow_dispatch)
# - v*-rc/beta/etc tags → pre-release version image tags (no :latest)
#
# Image Tags Created:
# - Push to develop: ghcr.io/org/repo:develop, ghcr.io/org/repo:develop-abc1234
# - Manual trigger on any branch: ghcr.io/org/repo:branch-name, ghcr.io/org/repo:branch-name-abc1234
# - Tag v1.0.0: ghcr.io/org/repo:v1.0.0, ghcr.io/org/repo:latest (only if highest version)
# - Tag v1.0.0-rc: ghcr.io/org/repo:v1.0.0-rc (no :latest)

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'  # Triggered when version tags are pushed
  workflow_dispatch:  # Manually trigger builds for feature/fix branches from the Actions tab

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: eneo-ai/eneo-backend
  FRONTEND_IMAGE_NAME: eneo-ai/eneo-frontend
  SEAWEEDFS_IMAGE_NAME: eneo-ai/eneo-seaweedfs
  SEAWEEDFS_VERSION: 4.40-eneo.1
  BUILDX_VERSION: v0.33.0
  BUILDKIT_IMAGE: moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f
  QEMU_IMAGE: docker.io/tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    outputs:
      backend_tag: ${{ steps.backend-version.outputs.version }}
      is_latest: ${{ steps.check-latest.outputs.is-latest }}
      is_release: ${{ steps.build-context.outputs.is-release }}
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Fetch full history for tags
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate tag is on correct release branch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # Extract major.minor from tag (e.g., v1.8.0-rc.1 → v1.8)
          EXPECTED_BRANCH="release/$(echo "$TAG" | grep -oE '^v[0-9]+\.[0-9]+')"

          # Check which branches contain this tag's commit
          BRANCHES=$(git branch -r --contains HEAD | sed 's|origin/||' | xargs)

          if [[ ! " $BRANCHES " =~ " $EXPECTED_BRANCH " ]]; then
            echo "::error::Tag $TAG must be on branch $EXPECTED_BRANCH, but it was found on: $BRANCHES"
            echo "Tags should only be created via GitHub Releases UI targeting the correct release branch."
            exit 1
          fi

          echo "✅ Tag $TAG is correctly on $EXPECTED_BRANCH"

      - name: Determine build context
        id: build-context
        run: |
          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            # Check if this is a pre-release (contains hyphen after version, e.g., v1.7.0-rc)
            if [[ "$VERSION" == *-* ]]; then
              echo "Building pre-release version: $VERSION"
              echo "is-release=true" >> $GITHUB_OUTPUT
              echo "is-prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "Building production version: $VERSION"
              echo "is-release=true" >> $GITHUB_OUTPUT
              echo "is-prerelease=false" >> $GITHUB_OUTPUT
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "Building develop branch for dev environment"
            echo "is-release=false" >> $GITHUB_OUTPUT
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            echo "Building branch: $BRANCH_NAME"
            echo "is-release=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if tag is latest
        id: check-latest
        if: steps.build-context.outputs.is-release == 'true' && steps.build-context.outputs.is-prerelease == 'false'
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -v '-' | head -1)
          if [[ "$CURRENT_TAG" == "$LATEST_TAG" ]]; then
            echo "is-latest=true" >> $GITHUB_OUTPUT
          else
            echo "is-latest=false" >> $GITHUB_OUTPUT
          fi

      # Backend build and push
      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            # Branch-based tags
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/develop' }}

            # Version tags (only for releases)
            type=semver,pattern={{version}},enable=${{ steps.build-context.outputs.is-release == 'true' }}

            type=raw,value=latest,enable=${{ steps.check-latest.outputs.is-latest == 'true' }}

            # Git SHA for traceability (always included)
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,enable=${{ github.ref_type == 'tag' }}

      - name: Inject backend version
        id: backend-version
        run: |
          # For branches, use the SHA-suffixed tag (second tag), for tags use first tag
          if [[ "${{ github.ref_type }}" == "branch" ]]; then
            VERSION=$(echo "${{ steps.meta-backend.outputs.tags }}" | sed -n '2p' | cut -d':' -f2)
          else
            VERSION=$(echo "${{ steps.meta-backend.outputs.tags }}" | head -n1 | cut -d':' -f2)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          ./scripts/inject-backend-version.sh "$VERSION"

      - name: Build and push backend Docker image
        id: build-backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          build-args: |
            OTEL_SERVICE_VERSION=${{ steps.backend-version.outputs.version }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest backend image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}
          subject-digest: ${{ steps.build-backend.outputs.digest }}
          push-to-registry: true

  build-and-push-frontend:
    needs: build-and-push-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0  # Fetch full history for tags
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq curl

      - name: Install bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Add swap for frontend image build
        run: |
          sudo fallocate --length 6G /mnt/eneo-frontend.swap
          sudo chmod 600 /mnt/eneo-frontend.swap
          sudo mkswap /mnt/eneo-frontend.swap
          sudo swapon /mnt/eneo-frontend.swap

      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          tags: |
            # Branch-based tags
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=ref,event=branch,enable=${{ github.ref != 'refs/heads/develop' }}

            # Version tags (only for releases)
            type=semver,pattern={{version}},enable=${{ needs['build-and-push-backend'].outputs.is_release == 'true' }}

            type=raw,value=latest,enable=${{ needs['build-and-push-backend'].outputs.is_latest == 'true' }}

            # Git SHA for traceability (always included)
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=sha,format=short,enable=${{ github.ref_type == 'tag' }}

      - name: Synchronize frontend with backend
        env:
          BACKEND_TAG: ${{ needs['build-and-push-backend'].outputs.backend_tag }}
        run: ./scripts/sync-frontend-with-backend.sh "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:$BACKEND_TAG"

      - name: Build and push frontend Docker image
        id: build-frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest frontend image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}
          subject-digest: ${{ steps.build-frontend.outputs.digest }}
          push-to-registry: true

  build-summary:
    name: Application image build summary
    needs:
      - build-and-push-backend
      - build-and-push-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Build Summary
        run: |
          echo "## 🐳 Docker Images Built and Pushed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ github.ref }}" == "refs/tags/v"* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            if [[ "$VERSION" == *-* ]]; then
              echo "### Pre-release: $VERSION" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Backend:**" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Frontend:**" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🧪 Pre-release images built for testing" >> $GITHUB_STEP_SUMMARY
            else
              echo "### Production Release: $VERSION" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Backend:**" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Frontend:**" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
              echo "- \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ Ready for production deployment" >> $GITHUB_STEP_SUMMARY
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "### Development Environment Build" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Backend:** \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:develop\`" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend:** \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:develop\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🔧 Images will be deployed to dev environment" >> $GITHUB_STEP_SUMMARY
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            BRANCH_TAG="${BRANCH_NAME//\//-}"
            echo "### Branch Build: $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Backend:** \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:$BRANCH_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "**Frontend:** \`${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:$BRANCH_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "🚀 Branch images built for testing and development" >> $GITHUB_STEP_SUMMARY
          fi

  seaweedfs-source-policy:
    name: SeaweedFS source policy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Verify pinned source, licenses, and reachable vulnerabilities
        env:
          GITHUB_API_TOKEN: ${{ github.token }}
        run: docker/seaweedfs/verify-supply-chain.sh source seaweedfs-source-evidence

      - name: Upload source policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-source-evidence
          path: seaweedfs-source-evidence/*
          if-no-files-found: error
          retention-days: 14

  seaweedfs-platform:
    name: SeaweedFS ${{ matrix.platform }}
    needs: seaweedfs-source-policy
    runs-on: ubuntu-latest
    environment: object-content-supply-chain
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
            curl_image: docker.io/curlimages/curl@sha256:5a91ea0c9c3ee27b4abe657b68cf6bf0676afa13b236b3bda34283cb3924d4f6
          - platform: linux/arm64
            slug: linux-arm64
            curl_image: docker.io/curlimages/curl@sha256:b949ec80877077def1544f0727d3e3101dd687fe20a5bf74997e557f7e3ac961

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU for the emulated arm64 build
        if: matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
        with:
          image: ${{ env.QEMU_IMAGE }}
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Log in to GHCR with the workflow identity
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable platform candidate by digest
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: docker/seaweedfs
          file: docker/seaweedfs/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=1784519823
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true
          cache-from: type=gha,scope=seaweedfs-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=seaweedfs-${{ matrix.slug }}

      - name: Set up an isolated reproducibility builder
        id: reproducibility-builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
          use: false

      - name: Rebuild independently to prove reproducibility
        id: rebuild
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          builder: ${{ steps.reproducibility-builder.outputs.name }}
          context: docker/seaweedfs
          file: docker/seaweedfs/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          no-cache: true
          build-args: SOURCE_DATE_EPOCH=1784519823
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true,rewrite-timestamp=true

      - name: Verify reproducible platform digest
        env:
          FIRST_DIGEST: ${{ steps.build.outputs.digest }}
          SECOND_DIGEST: ${{ steps.rebuild.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$FIRST_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$FIRST_DIGEST" == "$SECOND_DIGEST" ]]

      - name: Validate candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

      - name: Smoke test the reference deployment bootstrap
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          CURL_IMAGE: ${{ matrix.curl_image }}
        run: docker/seaweedfs/smoke-reference-deployment.sh "$IMAGE_REF" "$PLATFORM"

      - name: Download Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.44.0

      - name: Verify runtime and generate CycloneDX 1.6 and SPDX SBOMs
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          docker/seaweedfs/verify-supply-chain.sh image \
            "$IMAGE_REF" \
            "${{ matrix.platform }}" \
            seaweedfs-${{ matrix.slug }}-evidence

      - name: Block HIGH and CRITICAL vulnerabilities, including unfixed findings
        id: vulnerability-scan
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: json
          output-file: seaweedfs-${{ matrix.slug }}-evidence/grype-${{ matrix.slug }}.json
          grype-version: v0.110.0

      - name: Record exact platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s\n' "$DIGEST" \
            >"seaweedfs-${{ matrix.slug }}-evidence/DIGEST-${{ matrix.slug }}"

      - name: Attest platform image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest the platform SPDX SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: seaweedfs-${{ matrix.slug }}-evidence/seaweedfs-${{ matrix.slug }}.spdx.json
          push-to-registry: true

      - name: Attest platform policy evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: seaweedfs-${{ matrix.slug }}-evidence/*

      - name: Upload platform policy evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-${{ matrix.slug }}-evidence
          path: seaweedfs-${{ matrix.slug }}-evidence/*
          if-no-files-found: error
          retention-days: 14

  seaweedfs-publish:
    name: Publish attested SeaweedFS manifest
    needs:
      - seaweedfs-source-policy
      - seaweedfs-platform
    runs-on: ubuntu-latest
    environment: object-content-supply-chain
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Download verified evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: seaweedfs-*-evidence
          path: seaweedfs-evidence
          merge-multiple: true

      - name: Verify both platform evidence sets survived the merge
        run: |
          set -euo pipefail
          for platform in linux-amd64 linux-arm64; do
            for evidence in \
              "DIGEST-$platform" \
              "grype-$platform.json" \
              "IMAGE-PROVENANCE-$platform.txt" \
              "IMAGE-SHA256SUMS-$platform" \
              "seaweedfs-$platform.cyclonedx.json" \
              "seaweedfs-$platform.spdx.json"; do
              test -s "seaweedfs-evidence/$evidence"
            done
          done

      - name: Log in to GHCR with the workflow identity
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested multi-platform manifest
        id: manifest
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}
        run: |
          set -euo pipefail

          amd64_digest="$(cat seaweedfs-evidence/DIGEST-linux-amd64)"
          arm64_digest="$(cat seaweedfs-evidence/DIGEST-linux-arm64)"
          tag="${SEAWEEDFS_VERSION}-${GITHUB_SHA}"
          image_ref="$IMAGE:$tag"

          docker buildx imagetools create \
            --tag "$image_ref" \
            "$IMAGE@$amd64_digest" \
            "$IMAGE@$arm64_digest"

          docker buildx imagetools inspect "$image_ref" --raw \
            >seaweedfs-evidence/MANIFEST.json
          manifest_digest="$(docker buildx imagetools inspect "$image_ref" \
            --format '{{json .Manifest}}' | jq -r '.digest')"

          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          jq -e \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" '
              (.manifests | length) == 2
              and any(.manifests[];
                .platform.os == "linux"
                and .platform.architecture == "amd64"
                and .digest == $amd64)
              and any(.manifests[];
                .platform.os == "linux"
                and .platform.architecture == "arm64"
                and .digest == $arm64)
            ' seaweedfs-evidence/MANIFEST.json >/dev/null

          {
            printf 'seaweedfs manifest %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$manifest_digest"
            printf 'seaweedfs linux/amd64 %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$amd64_digest"
            printf 'seaweedfs linux/arm64 %s %s@%s\n' \
              "$image_ref" "$IMAGE" "$arm64_digest"
          } >seaweedfs-evidence/IMAGE-DIGESTS.txt
          (
            cd seaweedfs-evidence
            find . -maxdepth 1 -type f ! -name EVIDENCE-SHA256SUMS \
              -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
              >EVIDENCE-SHA256SUMS
          )

          {
            echo "image-ref=$image_ref"
            echo "manifest-digest=$manifest_digest"
          } >>"$GITHUB_OUTPUT"

      - name: Attest multi-platform image provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.manifest-digest }}
          push-to-registry: true

      - name: Attest source policy evidence
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4
        with:
          subject-path: |
            seaweedfs-evidence/SOURCE-PROVENANCE.txt
            seaweedfs-evidence/SOURCE-SHA256SUMS
            seaweedfs-evidence/govulncheck.txt
            seaweedfs-evidence/licenses.csv

      - name: Independently verify registry provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.SEAWEEDFS_IMAGE_NAME }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.manifest-digest }}
        run: |
          set -euo pipefail

          signer_workflow="${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}/.github/workflows/build_and_push_images.yml"
          common_flags=(
            --repo "$GITHUB_REPOSITORY"
            --signer-workflow "$signer_workflow"
            --source-digest "$GITHUB_SHA"
            --source-ref "$GITHUB_REF"
            --deny-self-hosted-runners
            --bundle-from-oci
          )

          gh attestation verify "oci://$IMAGE@$MANIFEST_DIGEST" \
            "${common_flags[@]}" \
            --predicate-type https://slsa.dev/provenance/v1
          for platform in linux-amd64 linux-arm64; do
            digest="$(cat "seaweedfs-evidence/DIGEST-$platform")"
            gh attestation verify "oci://$IMAGE@$digest" \
              "${common_flags[@]}" \
              --predicate-type https://slsa.dev/provenance/v1
            gh attestation verify "oci://$IMAGE@$digest" \
              "${common_flags[@]}" \
              --predicate-type https://spdx.dev/Document/v2.3
          done

      - name: Upload publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: seaweedfs-publication-${{ github.sha }}
          path: seaweedfs-evidence/*
          if-no-files-found: error
          retention-days: 30

      - name: SeaweedFS publication summary
        run: |
          {
            echo "## Eneo SeaweedFS reference image"
            echo ""
            echo "Published and independently verified:"
            echo ""
            sed 's/^/- `/' seaweedfs-evidence/IMAGE-DIGESTS.txt | sed 's/$/`/'
          } >>"$GITHUB_STEP_SUMMARY"
