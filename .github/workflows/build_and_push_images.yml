name: Build and Push Docker Images
# External deployment systems consume the completed release bundle, never independent aliases.
on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:
# Serialize all application publication, including alias promotion and reruns.
concurrency:
  group: eneo-application-publication
  cancel-in-progress: false
permissions:
  contents: read
  pull-requests: read
  packages: write
  attestations: write
  artifact-metadata: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      revision: ${{ steps.resolve.outputs.revision }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve shared build identity
        id: resolve
        run: python3 scripts/release_bundle.py resolve
      - name: Validate release branch and notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          branch="release/$(echo "$tag" | grep -oE '^v[0-9]+\.[0-9]+')"
          git merge-base --is-ancestor HEAD "origin/$branch"
          python3 scripts/check_whats_new.py --repo-root . --release-tag "$tag"
      - name: Release and deployment contract tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_*.py'
  checks:
    needs: release
    uses: ./.github/workflows/ci.yml
  backend:
    needs: release
    uses: ./.github/workflows/application_image.yml
    with:
      component: backend
      version: ${{ needs.release.outputs.version }}
      revision: ${{ needs.release.outputs.revision }}
  frontend:
    needs: [release, backend]
    uses: ./.github/workflows/application_image.yml
    with:
      component: frontend
      version: ${{ needs.release.outputs.version }}
      revision: ${{ needs.release.outputs.revision }}
      backend_digest: ${{ needs.backend.outputs.digest }}
  tool-runtime:
    needs: release
    uses: ./.github/workflows/tool_runtime_image.yml
    with:
      version: ${{ needs.release.outputs.version }}
      revision: ${{ needs.release.outputs.revision }}
      publish: true
  bundle:
    needs: [release, checks, backend, frontend, tool-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.33.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify every published component
        id: bundle
        run: |
          python3 scripts/release_bundle.py bundle
          echo "runtime-image=$(jq -r '.images["tool-runtime"]' release-bundle/release.json)" >>"$GITHUB_OUTPUT"
      - name: Scan the exact runtime digest, including on retries
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: ${{ steps.bundle.outputs.runtime-image }}
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
          grype-version: v0.117.0
      - name: Smoke test the exact bundle
        run: python3 scripts/smoke_release_bundle.py release-bundle/release.json
      - name: Attest the complete bundle
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: release-bundle/*
      - name: Publish complete bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eneo-release-${{ needs.release.outputs.version }}
          path: release-bundle/
          if-no-files-found: error
          overwrite: true
      - name: Attach bundle to an existing GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release upload "${GITHUB_REF#refs/tags/}" release-bundle/release.json release-bundle/release.env --clobber
      - name: Promote aliases only for the current branch head or newest final release
        run: python3 scripts/release_bundle.py promote
  release-sbom:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      packages: read
      attestations: write
      artifact-metadata: write
      id-token: write
    uses: ./.github/workflows/release_sbom.yml
    with:
      tag: ${{ github.ref_name }}
      upload_release_assets: true
