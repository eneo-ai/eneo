name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
  # Merge queue candidates (develop + queued PRs). Scope selection runs every
  # check for these events, and the
  # aggregate CI job reports the required "CI" check on the candidate.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change scope
    needs: [branch-policy, user-facing, no-intric]
    # PR-only gates are skipped on pushes and merge candidates. Any actual
    # failure or cancellation must prevent the expensive matrix from starting.
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.scope.outputs.checks }}
      docker_backend: ${{ steps.scope.outputs.docker_backend }}
      docker_frontend: ${{ steps.scope.outputs.docker_frontend }}
      docker_devcontainer: ${{ steps.scope.outputs.docker_devcontainer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          head="$HEAD_SHA"
          files="$RUNNER_TEMP/changed-files.txt"

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$head" > "$files"
          else
            git diff --name-only "$base" "$head" > "$files"
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"
          {
            echo "## Changed files"
            echo ""
            if [[ -s "$files" ]]; then
              sed 's/^/- `/' "$files" | sed 's/$/`/'
            else
              echo "_No changed files detected. CI will fail open and run all scoped jobs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: node .github/scripts/ci-change-scope.mjs --files "${{ steps.changed-files.outputs.files }}" --event-name "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  branch-policy:
    if: github.event_name == 'pull_request'
    name: Branch policy
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == release/* ]]; then
            echo "Long-lived branch; skipping naming convention check."
            exit 0
          fi

          VALID_PREFIXES="^(dependabot/|feature/|feat/|fix/|hotfix/|security/|chore/|deps/|docs/|test/|refactor/|remove/|ci/|perf/)"

          if [[ ! "$BRANCH_NAME" =~ $VALID_PREFIXES ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow the naming convention."
            echo "Use one of: dependabot/, feature/, feat/, fix/, hotfix/, security/, chore/, deps/, docs/, test/, refactor/, remove/, ci/, or perf/."
            exit 1
          fi

  # Keep this caller until the standalone User-facing section check replaces
  # its aggregate requirement; it is also a cheap gate before the matrix.
  user-facing:
    name: User-facing section (CI transition)
    uses: ./.github/workflows/user-facing.yml

  no-intric:
    name: No intric references
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against re-introducing the old product name
        run: python3 scripts/check_no_intric.py --repo-root .

  checks:
    name: Checks (${{ matrix.check }})
    needs: changes
    if: needs.changes.outputs.checks != '[]'
    strategy:
      # This matrix owns every expensive CI check, so a failed check cancels
      # queued and running siblings, including their reusable-workflow jobs.
      fail-fast: true
      matrix:
        check: ${{ fromJSON(needs.changes.outputs.checks) }}
    uses: ./.github/workflows/ci-check.yml
    with:
      check: ${{ matrix.check }}
      docker-backend: ${{ needs.changes.outputs.docker_backend == 'true' }}
      docker-frontend: ${{ needs.changes.outputs.docker_frontend == 'true' }}
      docker-devcontainer: ${{ needs.changes.outputs.docker_devcontainer == 'true' }}

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, branch-policy, user-facing, no-intric, checks]

    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          USER_FACING_RESULT: ${{ needs.user-facing.result }}
          NO_INTRIC_RESULT: ${{ needs.no-intric.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          SELECTED_CHECKS: ${{ needs.changes.outputs.checks }}
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name failed with result: $result"
                failed=1
                ;;
            esac
          }

          check_result "Change scope" "$CHANGES_RESULT"
          check_result "Branch policy" "$BRANCH_POLICY_RESULT"
          check_result "User-facing section" "$USER_FACING_RESULT"
          check_result "No intric references" "$NO_INTRIC_RESULT"
          check_result "Selected checks" "$CHECKS_RESULT"

          # A skipped matrix is legitimate only when successful scope detection
          # selected no checks. Cancelled siblings must never turn the gate green.
          if [[ "$CHANGES_RESULT" != success ||
                ( "$CHECKS_RESULT" == skipped && "$SELECTED_CHECKS" != '[]' ) ]]; then
            echo "::error::CI did not complete the selected checks."
            failed=1
          fi

          exit "$failed"
