name: CI

on:
  workflow_call:
  # Develop pushes are validated once by Build and Push Docker Images.
  push:
    branches:
      - "release/**"
  pull_request:
    branches:
      - develop
      - "release/**"
  # Classify the entire candidate diff, including preceding queued PRs.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: placeholder
  POSTGRES_HOST: placeholder
  POSTGRES_PASSWORD: placeholder
  POSTGRES_PORT: 5432
  POSTGRES_DB: placeholder
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  MAX_IN_QUESTION: 1
  API_PREFIX: /api/v1
  API_KEY_LENGTH: 64
  API_KEY_HEADER_NAME: X-API-Key
  JWT_AUDIENCE: test
  JWT_ISSUER: test
  JWT_EXPIRY_TIME: 3600
  JWT_ALGORITHM: HS256
  JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789
  JWT_TOKEN_PREFIX: Bearer
  URL_SIGNING_KEY: unit-test-url-signing-key-with-at-least-32-bytes
  ENCRYPTION_KEY: yPIAaWTENh5knUuz75NYHblR3672X-7lH-W6AD4F1hs=
  OPENAI_API_KEY: test-api-key

jobs:
  security:
    uses: ./.github/workflows/security.yml
    with:
      base_sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}

  changes:
    name: Scope and repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      full: ${{ steps.scope.outputs.full }}
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      frontend_e2e: ${{ steps.scope.outputs.frontend_e2e }}
      schema: ${{ steps.scope.outputs.schema }}
      scripts: ${{ steps.scope.outputs.scripts }}
      route_metadata: ${{ steps.scope.outputs.route_metadata }}
      web_next: ${{ steps.scope.outputs.web_next }}
      web_next_e2e: ${{ steps.scope.outputs.web_next_e2e }}
      docker: ${{ steps.scope.outputs.docker }}
      docker_matrix: ${{ steps.scope.outputs.docker_matrix }}
      expected_jobs: ${{ steps.scope.outputs.expected_jobs }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Plan CI from the event's complete diff
        id: scope
        run: node .github/scripts/ci-change-scope.mjs --github-event >> "$GITHUB_OUTPUT"

      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == release/* ]]; then
            echo "Long-lived branch; skipping naming convention check."
            exit 0
          fi

          VALID_PREFIXES="^(dependabot/|feature/|feat/|fix/|hotfix/|security/|chore/|deps/|docs/|test/|refactor/|remove/|ci/|perf/)"

          if [[ ! "$BRANCH_NAME" =~ $VALID_PREFIXES ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow the naming convention."
            echo "Use one of: dependabot/, feature/, feat/, fix/, hotfix/, security/, chore/, deps/, docs/, test/, refactor/, remove/, ci/, or perf/."
            exit 1
          fi

      - name: Guard against re-introducing the old product name
        run: python3 scripts/check_no_intric.py --repo-root .

      - name: Check all HTTP route decorators
        if: steps.scope.outputs.route_metadata == 'true'
        run: python3 scripts/check_route_metadata.py --repo-root . --all

      - name: Run developer-tooling tests
        if: steps.scope.outputs.scripts == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run project workflow self-tests
        if: steps.scope.outputs.scripts == 'true'
        run: |
          node .github/scripts/ensure-project-fields.mjs --self-test
          node .github/scripts/project-intake.mjs --self-test
          node --test --test-concurrency=1 .github/scripts/label-policy.test.mjs .github/scripts/project-intake.test.mjs
          node --test --test-concurrency=1 \
            .github/scripts/evaluate-backend-audit.test.mjs \
            .github/scripts/fetch-backend-audit-severities.test.mjs \
            frontend/scripts/audit-dependencies.test.mjs
          node --test --test-concurrency=1 .github/scripts/ci-contract.test.mjs
          node .github/scripts/check-user-facing.mjs --self-test
          node scripts/collect_user_facing.mjs --self-test
          node scripts/export_github_roadmap.mjs --self-test

  backend-quality:
    name: Backend quality
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --python 3.11 --frozen --all-groups

      - name: Verify Alembic migration graph
        run: uv run pytest -q tests/unit/test_alembic_migration_graph.py

      - name: Ruff lint
        run: uv run ruff check src/eneo --output-format github

      - name: Ruff format check
        run: uv run ruff format --check src/eneo

      - name: Pyright type check
        run: uv run pyright

  backend-tests:
    name: Backend tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, suite: unit, shard: 0 }
          - { name: integration-1, suite: integration, shard: 1 }
          - { name: integration-2, suite: integration, shard: 2 }
          - { name: integration-3, suite: integration, shard: 3 }
          - { name: integration-4, suite: integration, shard: 4 }
          - { name: migrations, suite: migrations, shard: 0 }
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --python 3.11 --frozen --all-groups

      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: uv run pytest -v -n 4 --durations=25 -m "not integration" tests/

      - name: Run integration tests
        if: matrix.suite == 'integration'
        # Four standard runners, each with four workers and isolated databases.
        # Partition files, not node IDs, so module fixtures stay in one shard.
        # A test still running after 600s dumps every thread's stack to the log.
        # The slowest test takes about 30s; the dump must precede the job limit.
        run: |
          python3 ../scripts/backend_test_shard.py --index "$SHARD_INDEX" --count 4 > "$RUNNER_TEMP/integration-files.txt"
          mapfile -t test_files < "$RUNNER_TEMP/integration-files.txt"
          uv run pytest -v -n 4 --durations=25 -o faulthandler_timeout=600 -m integration "${test_files[@]}"
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Verify crawler migration rollback
        # These tests own disposable databases and deliberately change their schema.
        run: >-
          uv run pytest -q -m migration_isolation
          tests/integration/migrations/test_crawl_lifecycle_round_trip.py
          tests/integration/migrations/test_website_source_url_identity.py
          tests/integration/migrations/test_crawler_develop_rollback.py
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Verify File/Icon upgrade and optional cleanup on PostgreSQL 13
        if: matrix.suite == 'migrations'
        # Migration tests are opt-in and run outside the parallel suite. The
        # restore rehearsal needs its own application/database session.
        timeout-minutes: 10
        run: |
          uv run pytest -v --durations=25 -m migration_isolation \
            tests/integration/migrations/test_file_icon_preflight.py \
            tests/integration/migrations/test_file_icon_legacy_cleanup.py
          uv run pytest -v --durations=25 -o faulthandler_timeout=180 -m migration_isolation \
            tests/integration/migrations/test_file_icon_bridge_rehearsal.py
        env:
          ENEO_FILE_ICON_REHEARSAL_PROFILE: smoke
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock

  # Preserve the existing required CI gate during rollout. Remove this caller
  # and its aggregate references once the standalone User-facing section check
  # is required in GitHub (see the What's new PLAYBOOK).
  user-facing:
    name: User-facing section (CI transition)
    uses: ./.github/workflows/user-facing.yml

  frontend:
    name: Frontend checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Enforced in pre-commit too, but pre-commit can be bypassed; CI is the
      # backstop that keeps the i18n catalogs duplicate-free, in key parity and free of
      # keys the app no longer uses.
      - name: Check i18n message catalogs
        run: |
          python3 apps/web/scripts/check-i18n-duplicates.py
          python3 apps/web/scripts/check-i18n-parity.py
          python3 apps/web/scripts/check-i18n-unused.py

      # User-facing release notes: schema, sv+en parity, newest-first order,
      # that every "Show me" anchor still exists in the web app, and the rules
      # of the branch the change lands on (unreleased notes only on develop).
      - name: Check What's new release notes
        working-directory: .
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}
        run: python3 scripts/check_whats_new.py --repo-root . --branch "$TARGET_BRANCH"

      - name: Set up frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Build workspace dependencies
        run: bun run --filter @eneo/ui build

      - name: Run type checks
        run: FORCE_COLOR=1 bun run --filter '@eneo/*' --filter '!@eneo/web-next' check

      # The docs workflow owns docs-site lint/build; this gate stays focused on shipped frontend packages.
      - name: Run package lint
        run: FORCE_COLOR=1 bun run --filter '@eneo/*' --filter '!@eneo/web-next' lint

      - name: Run package tests
        run: |
          FORCE_COLOR=1 bun run --filter '@eneo/eslint-plugin' test
          FORCE_COLOR=1 bun run --filter '@eneo/eneo-js' test
          FORCE_COLOR=1 bun run --filter '@eneo/whats-new' test
          FORCE_COLOR=1 bun run --filter '@eneo/markdown-math' test

      # Use the installed runner so browser revisions track the lockfile.
      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      - name: Run frontend dev lifecycle tests
        run: FORCE_COLOR=1 bun run test:dev-lifecycle

      - name: Run web unit & component tests
        run: FORCE_COLOR=1 bun run --filter '@eneo/web' test

  frontend-web-next:
    name: Frontend (web-next)
    needs: changes
    if: needs.changes.outputs.web_next == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # env.ts validates at import time; build/test need a valid baseline
      ENEO_BACKEND_URL: http://localhost:8123
      SESSION_SECRET: ci-only-session-secret-32-chars-min!!

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Lint
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' lint

      - name: Type check
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' check

      - name: Test
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' test

      - name: Build
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' build

  frontend-e2e:
    name: Frontend E2E
    needs: changes
    if: needs.changes.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Isolated, prod-safe stack: own postgres/redis, a deterministic mock model,
      # and the backend built from its Dockerfile. Nothing touches a real provider.
      - name: Start isolated E2E stack in the background
        # Building the backend image and waiting for the stack's health checks
        # take ~2 min and need nothing from the frontend steps, so they overlap
        # with bun install and the web build. "Wait for the E2E stack" collects
        # the exit status before the tests start.
        run: |
          nohup bash -c 'docker compose -f docker-compose.e2e.ci.yml up -d --build --wait; echo $? > "$RUNNER_TEMP/e2e-stack.exit"' \
            > "$RUNNER_TEMP/e2e-stack.log" 2>&1 &

      - name: Set up frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Build workspace dependencies
        working-directory: frontend
        run: bun run --filter @eneo/ui build

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright

      # Build the production app up front so the Playwright webServer only has to
      # start `preview`. A full `vite build` inside the webServer's 180s timeout
      # is the root cause of the flaky "Timed out waiting from config.webServer":
      # its wall-clock straddles 180s on shared runners. SVELTE_KIT_OUT_DIR must
      # match playwright.config.ts so `preview` serves exactly this build; the
      # backend URLs are read at runtime (via $env/dynamic) so they don't affect
      # the artifact, but we set them to mirror the previous build environment.
      - name: Build web app for E2E
        working-directory: frontend/apps/web
        env:
          SVELTE_KIT_OUT_DIR: .svelte-kit-e2e
          NODE_OPTIONS: --max-old-space-size=8192
        run: /usr/bin/time -v -o "$RUNNER_TEMP/frontend-build-resources.txt" bun run build

      - name: Upload build resource measurements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-build-resources
          path: ${{ runner.temp }}/frontend-build-resources.txt
          if-no-files-found: ignore
          retention-days: 7

      # Below the 8 GB heap: a successful build at about 9.2 GB RSS was already
      # on the edge of a random out-of-memory crash.
      - name: Check build memory budget
        env:
          BUILD_MEMORY_BUDGET_MB: "7680"
        run: node .github/scripts/ci-build-memory.mjs "$RUNNER_TEMP/frontend-build-resources.txt"

      - name: Wait for the E2E stack
        run: |
          for _ in $(seq 1 300); do
            [ -f "$RUNNER_TEMP/e2e-stack.exit" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/e2e-stack.log"
          [ "$(cat "$RUNNER_TEMP/e2e-stack.exit" 2>/dev/null)" = "0" ]

      - name: Run E2E tests
        working-directory: frontend/apps/web
        env:
          # The workflow owns the stack lifecycle, so Playwright must not manage it.
          E2E_MANAGE_STACK: "0"
          # Keep SSR and direct API helpers on one deterministic loopback path.
          E2E_BACKEND_URL: http://127.0.0.1:8124
          E2E_JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789 # matches the e2e-backend JWT_SECRET
        run: bun run test:e2e

      - name: Capture E2E stack diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.e2e.ci.yml ps --all \
            > e2e-artifacts/compose-ps.txt
          docker compose -f docker-compose.e2e.ci.yml logs \
            --no-color --timestamps \
            > e2e-artifacts/compose.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report
            e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop E2E stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.e2e.ci.yml down -v

  # web-next end-to-end and page-level accessibility (tests/a11y.spec.ts: axe
  # WCAG 2.2 A/AA scans in light and dark mode, plus the skip link) against the
  # same isolated stack as "Frontend E2E". Both E2E suites are required by CI
  # when their app, shared frontend inputs, or the backend changes.
  frontend-web-next-e2e:
    name: Frontend E2E (web-next)
    needs: changes
    if: needs.changes.outputs.web_next_e2e == 'true'
    runs-on: ubuntu-24.04
    # Stack build (~2 min), install, build and the specs take ~10 min; a hung
    # stack or browser must not hold a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    env:
      # env.ts validates at import time, during the build and in `next start`.
      # The server talks to the stack's backend on the loopback port.
      ENEO_BACKEND_URL: http://127.0.0.1:8124
      SESSION_SECRET: ci-only-session-secret-32-chars-min!!
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Isolated, prod-safe stack: own postgres/redis, a deterministic mock model,
      # and the backend built from its Dockerfile. Nothing touches a real provider.
      - name: Start isolated E2E stack in the background
        # The backend image build and health checks overlap with bun install and
        # the web-next build. "Wait for the E2E stack" collects the exit status
        # before the tests start.
        run: |
          nohup bash -c 'docker compose -f docker-compose.e2e.ci.yml up -d --build --wait; echo $? > "$RUNNER_TEMP/e2e-stack.exit"' \
            > "$RUNNER_TEMP/e2e-stack.log" 2>&1 &

      - name: Set up frontend dependencies
        uses: ./.github/actions/setup-frontend

      - name: Install Playwright Chromium
        uses: ./.github/actions/setup-playwright
        with:
          working-directory: frontend/apps/web-next

      # Next's incremental build cache: unchanged modules are not recompiled.
      - name: Cache Next.js build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: frontend/apps/web-next/.next/cache
          key: next-web-next-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-${{ hashFiles('frontend/apps/web-next/src/**', 'frontend/apps/web-next/next.config.ts', 'frontend/apps/web-next/public/**') }}
          restore-keys: next-web-next-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}-

      # Build up front so the Playwright webServer only has to run `next start`
      # (playwright.config.ts), keeping the build out of its startup timeout.
      - name: Build web-next for E2E
        working-directory: frontend/apps/web-next
        run: bun run build

      - name: Wait for the E2E stack
        run: |
          for _ in $(seq 1 300); do
            [ -f "$RUNNER_TEMP/e2e-stack.exit" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/e2e-stack.log"
          [ "$(cat "$RUNNER_TEMP/e2e-stack.exit" 2>/dev/null)" = "0" ]

      - name: Run E2E and accessibility tests
        working-directory: frontend/apps/web-next
        env:
          E2E_PORT: "3100"
          # The login seeded by docker-compose.e2e.ci.yml (DEFAULT_USER_*).
          E2E_USER: e2e@example.com
          E2E_PASSWORD: E2ePassword123!
        run: bun run test:e2e

      - name: Capture E2E stack diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.e2e.ci.yml ps --all \
            > e2e-artifacts/compose-ps.txt
          docker compose -f docker-compose.e2e.ci.yml logs \
            --no-color --timestamps \
            > e2e-artifacts/compose.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-web-next
          path: |
            frontend/apps/web-next/playwright-report
            frontend/apps/web-next/test-results
            e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop E2E stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.e2e.ci.yml down -v

  schema-drift:
    name: Schema drift
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --python 3.11 --frozen --all-groups
        working-directory: backend

      - name: Set up frontend dependencies
        uses: ./.github/actions/setup-frontend

      # schema.d.ts is generated from the backend OpenAPI spec; nothing else keeps
      # it in sync, so a backend model change that skips regeneration silently
      # leaves the frontend types (and any ActionType-driven i18n guards) stale.
      - name: Dump backend OpenAPI spec
        run: uv run python -c "import json; from eneo.server.main import app; json.dump(app.openapi(), open('/tmp/openapi.gen.json', 'w'))"
        working-directory: backend

      - name: Regenerate schema.d.ts (eneo-js)
        run: |
          bun x openapi-typescript /tmp/openapi.gen.json -o src/types/schema.d.ts --default-non-nullable=false
          bun x prettier --write src/types/schema.d.ts
        working-directory: frontend/packages/eneo-js

      - name: Regenerate schema.d.ts (web-next)
        run: |
          bun x openapi-typescript /tmp/openapi.gen.json -o src/lib/api/schema.d.ts --default-non-nullable=false
          bun x prettier --write src/lib/api/schema.d.ts
        working-directory: frontend/apps/web-next

      - name: Fail on schema drift
        run: |
          STATUS=0
          for SCHEMA in \
            frontend/packages/eneo-js/src/types/schema.d.ts \
            frontend/apps/web-next/src/lib/api/schema.d.ts; do
            if git diff --quiet -- "$SCHEMA"; then
              echo "$SCHEMA is in sync with the backend OpenAPI spec."
              continue
            fi
            STATUS=1

            echo "::error file=$SCHEMA::Out of sync with the backend OpenAPI spec — regenerate and commit it."

            # Render the drift in the job Summary so it's visible without opening raw logs.
            {
              echo "## ❌ schema.d.ts drift detected"
              echo ""
              echo "\`$SCHEMA\` does not match the backend OpenAPI spec."
              echo "Regenerate it (\`node update.js\` in eneo-js / \`bun run gen:api\` in web-next against a backend, or the offline \`app.openapi()\` regen) and commit the result."
              echo ""
              echo "<details><summary>Diff — committed (red) vs. regenerated/expected (green)</summary>"
              echo ""
              echo '```diff'
              git diff --no-color -- "$SCHEMA"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            # Also surface it in the step log, collapsed.
            echo "::group::$SCHEMA diff (committed vs. regenerated)"
            git diff -- "$SCHEMA"
            echo "::endgroup::"
          done
          exit $STATUS

  docker-builds:
    name: Docker builds (${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.docker_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.33.0
          driver-opts: image=moby/buildkit@sha256:0168606be2315b7c807a03b3d8aa79beefdb31c98740cebdffdfeebf31190c9f

      - name: Add swap for frontend image build
        if: matrix.image == 'frontend'
        run: |
          sudo fallocate --length 4G /mnt/eneo-frontend.swap
          sudo chmod 600 /mnt/eneo-frontend.swap
          sudo mkswap /mnt/eneo-frontend.swap
          sudo swapon /mnt/eneo-frontend.swap

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          pull: true
          push: false
          # Default-branch publication exports each application image's cache
          # under its own scope; a second export of the same layers here would
          # only double cache storage. The devcontainer has no publication
          # build, so CI warms its cache itself, on branch pushes only:
          # PR/queue refs cannot share exported caches with later candidates.
          cache-from: |
            type=gha,scope=ci-${{ matrix.image }},timeout=2m
            type=gha,scope=${{ matrix.image }},timeout=2m
          cache-to: ${{ github.event_name == 'push' && matrix.image == 'devcontainer' && 'type=gha,mode=max,scope=ci-devcontainer,timeout=2m,ignore-error=true' || '' }}

  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - changes
      - security
      - user-facing
      - backend-quality
      - backend-tests
      - frontend
      - frontend-e2e
      - frontend-web-next
      - frontend-web-next-e2e
      - schema-drift
      - docker-builds

    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify required jobs against the CI plan
        env:
          EXPECTED_JOBS: ${{ needs.changes.outputs.expected_jobs }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-gate.mjs
