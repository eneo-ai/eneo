name: CI

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop
      - 'release/**'
  # Merge queue candidates (develop + queued PRs). Every scoped job runs in
  # full here (their conditions only scope pull_request events), and the
  # aggregate CI job reports the required "CI" check on the candidate.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_USER: placeholder
  POSTGRES_HOST: placeholder
  POSTGRES_PASSWORD: placeholder
  POSTGRES_PORT: 5432
  POSTGRES_DB: placeholder
  REDIS_HOST: localhost
  REDIS_PORT: 6379
  MAX_IN_QUESTION: 1
  API_PREFIX: /api/v1
  API_KEY_LENGTH: 64
  API_KEY_HEADER_NAME: X-API-Key
  JWT_AUDIENCE: test
  JWT_ISSUER: test
  JWT_EXPIRY_TIME: 3600
  JWT_ALGORITHM: HS256
  JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789
  JWT_TOKEN_PREFIX: Bearer
  URL_SIGNING_KEY: test_key
  ENCRYPTION_KEY: yPIAaWTENh5knUuz75NYHblR3672X-7lH-W6AD4F1hs=
  OPENAI_API_KEY: test-api-key

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      backend: ${{ steps.scope.outputs.backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      frontend_e2e: ${{ steps.scope.outputs.frontend_e2e }}
      schema: ${{ steps.scope.outputs.schema }}
      scripts: ${{ steps.scope.outputs.scripts }}
      route_metadata: ${{ steps.scope.outputs.route_metadata }}
      docker_backend: ${{ steps.scope.outputs.docker_backend }}
      docker_frontend: ${{ steps.scope.outputs.docker_frontend }}
      docker_devcontainer: ${{ steps.scope.outputs.docker_devcontainer }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          BEFORE_SHA: ${{ github.event.before || github.event.merge_group.base_sha || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi

          head="$HEAD_SHA"
          files="$RUNNER_TEMP/changed-files.txt"

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            git diff-tree --no-commit-id --name-only -r "$head" > "$files"
          else
            git diff --name-only "$base" "$head" > "$files"
          fi

          echo "files=$files" >> "$GITHUB_OUTPUT"
          {
            echo "## Changed files"
            echo ""
            if [[ -s "$files" ]]; then
              sed 's/^/- `/' "$files" | sed 's/$/`/'
            else
              echo "_No changed files detected. CI will fail open and run all scoped jobs._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Classify CI scope
        id: scope
        run: node .github/scripts/ci-change-scope.mjs --files "${{ steps.changed-files.outputs.files }}" >> "$GITHUB_OUTPUT"

  branch-policy:
    if: github.event_name == 'pull_request'
    name: Branch policy
    runs-on: ubuntu-latest

    steps:
      - name: Check branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "develop" || "$BRANCH_NAME" == release/* ]]; then
            echo "Long-lived branch; skipping naming convention check."
            exit 0
          fi

          VALID_PREFIXES="^(dependabot/|feature/|feat/|fix/|hotfix/|security/|chore/|deps/|docs/|test/|refactor/|remove/|ci/|perf/)"

          if [[ ! "$BRANCH_NAME" =~ $VALID_PREFIXES ]]; then
            echo "::error::Branch name '$BRANCH_NAME' does not follow the naming convention."
            echo "Use one of: dependabot/, feature/, feat/, fix/, hotfix/, security/, chore/, deps/, docs/, test/, refactor/, remove/, ci/, or perf/."
            exit 1
          fi

  backend-quality:
    name: Backend quality
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --python 3.11 --frozen --all-groups

      - name: Verify Alembic migration graph
        run: uv run pytest -q tests/unit/test_alembic_migration_graph.py

      - name: Ruff lint
        run: uv run ruff check src/eneo --output-format github

      - name: Ruff format check
        run: uv run ruff format --check src/eneo

      - name: Pyright type check
        run: uv run pyright

  backend-tests:
    name: Backend tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: unit, suite: unit, shard: 0 }
          - { name: integration-1, suite: integration, shard: 1 }
          - { name: integration-2, suite: integration, shard: 2 }
          - { name: integration-3, suite: integration, shard: 3 }
          - { name: integration-4, suite: integration, shard: 4 }
          - { name: migrations, suite: migrations, shard: 0 }
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1

      - name: Verify lockfile consistency
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --python 3.11 --frozen --all-groups

      - name: Run unit tests
        if: matrix.suite == 'unit'
        run: uv run pytest -v -n 4 --durations=25 -m "not integration" tests/

      - name: Run integration tests
        if: matrix.suite == 'integration'
        # Four standard runners, each with four workers and isolated databases.
        # Partition files, not node IDs, so module fixtures stay in one shard.
        run: |
          python3 ../scripts/backend_test_shard.py --index "$SHARD_INDEX" --count 4 > "$RUNNER_TEMP/integration-files.txt"
          mapfile -t test_files < "$RUNNER_TEMP/integration-files.txt"
          uv run pytest -v -n 4 --durations=25 -m integration "${test_files[@]}"
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Verify File/Icon upgrade and optional cleanup on PostgreSQL 13
        if: matrix.suite == 'migrations'
        # Migration tests are opt-in and run outside the parallel suite. The
        # restore rehearsal needs its own application/database session.
        timeout-minutes: 10
        run: |
          uv run pytest -v --durations=25 -m migration_isolation \
            tests/integration/migrations/test_file_icon_preflight.py \
            tests/integration/migrations/test_file_icon_legacy_cleanup.py
          uv run pytest -v --durations=25 -o faulthandler_timeout=180 -m migration_isolation \
            tests/integration/migrations/test_file_icon_bridge_rehearsal.py
        env:
          ENEO_FILE_ICON_REHEARSAL_PROFILE: smoke
          TESTCONTAINERS_RYUK_DISABLED: "true"
          DOCKER_HOST: unix:///var/run/docker.sock

  script-tests:
    name: Script tests
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run developer-tooling tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

      - name: Run project workflow self-tests
        run: |
          node .github/scripts/ensure-project-fields.mjs --self-test
          node .github/scripts/project-intake.mjs --self-test
          node .github/scripts/ci-change-scope.mjs --self-test
          node .github/scripts/check-user-facing.mjs --self-test
          node scripts/collect_user_facing.mjs --self-test
          node scripts/export_github_roadmap.mjs --self-test

  # Preserve the existing required CI gate during rollout. Remove this caller
  # and its aggregate references once the standalone User-facing section check
  # is required in GitHub (see the What's new PLAYBOOK).
  user-facing:
    name: User-facing section (CI transition)
    uses: ./.github/workflows/user-facing.yml

  route-metadata:
    name: Route metadata
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.route_metadata == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all HTTP route decorators
        run: python3 scripts/check_route_metadata.py --repo-root . --all

  no-intric:
    name: No intric references
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard against re-introducing the old product name
        run: python3 scripts/check_no_intric.py --repo-root .

  frontend:
    name: Frontend (${{ matrix.task }})
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The production build and the checks/tests are independent and each
        # take ~3 min, so they run on separate runners instead of back to back.
        task: [checks, build]
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Enforced in pre-commit too, but pre-commit can be bypassed; CI is the
      # backstop that keeps the i18n catalogs duplicate-free, in key parity and free of
      # keys the app no longer uses.
      - name: Check i18n message catalogs
        if: matrix.task == 'checks'
        run: |
          python3 apps/web/scripts/check-i18n-duplicates.py
          python3 apps/web/scripts/check-i18n-parity.py
          python3 apps/web/scripts/check-i18n-unused.py

      # User-facing release notes: schema, sv+en parity, newest-first order and
      # that every "Show me" anchor still exists in the web app.
      - name: Check What's new release notes
        if: matrix.task == 'checks'
        working-directory: .
        run: python3 scripts/check_whats_new.py --repo-root .

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        run: bun run --filter @eneo/ui build

      - name: Run type checks
        if: matrix.task == 'checks'
        run: bun run check

      # The docs workflow owns docs-site lint/build; this gate stays focused on shipped frontend packages.
      - name: Run package lint
        if: matrix.task == 'checks'
        run: FORCE_COLOR=1 bun run --filter '@eneo/*' lint

      - name: Run package tests
        if: matrix.task == 'checks'
        run: |
          FORCE_COLOR=1 bun run --filter '@eneo/eslint-plugin' test
          FORCE_COLOR=1 bun run --filter '@eneo/eneo-js' test
          FORCE_COLOR=1 bun run --filter '@eneo/whats-new' test

      # Component tests run in a real Chromium via Vitest browser mode, so the
      # matching Playwright browser must be on the runner. Pin the playwright
      # version explicitly: a bare `bun x playwright` fetches the latest and
      # installs a browser build that @vitest/browser (on the pinned playwright)
      # can't find. Keep this in sync with apps/web's playwright dependency.
      - name: Install Playwright Chromium
        if: matrix.task == 'checks'
        run: bun x playwright@1.61.1 install --with-deps chromium chromium-headless-shell

      - name: Run frontend dev lifecycle tests
        if: matrix.task == 'checks'
        run: FORCE_COLOR=1 bun run test:dev-lifecycle

      - name: Run web unit & component tests
        if: matrix.task == 'checks'
        run: FORCE_COLOR=1 bun run --filter '@eneo/web' test

      - name: Build frontend
        if: matrix.task == 'build'
        run: bun run build
        env:
          # The Svelte production build exceeds Node's default heap on GitHub-hosted runners.
          NODE_OPTIONS: --max-old-space-size=8192

  frontend-web-next:
    name: Frontend (web-next)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # env.ts validates at import time; build/test need a valid baseline
      ENEO_BACKEND_URL: http://localhost:8123
      SESSION_SECRET: ci-only-session-secret-32-chars-min!!

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' lint

      - name: Type check
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' check

      - name: Test
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' test

      - name: Build
        run: FORCE_COLOR=1 bun run --filter '@eneo/web-next' build

  frontend-e2e:
    name: Frontend E2E
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.frontend_e2e == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Isolated, prod-safe stack: own postgres/redis, a deterministic mock model,
      # and the backend built from its Dockerfile. Nothing touches a real provider.
      - name: Start isolated E2E stack in the background
        # Building the backend image and waiting for the stack's health checks
        # take ~2 min and need nothing from the frontend steps, so they overlap
        # with bun install and the web build. "Wait for the E2E stack" collects
        # the exit status before the tests start.
        run: |
          nohup bash -c 'docker compose -f docker-compose.e2e.ci.yml up -d --build --wait; echo $? > "$RUNNER_TEMP/e2e-stack.exit"' \
            > "$RUNNER_TEMP/e2e-stack.log" 2>&1 &

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build workspace dependencies
        working-directory: frontend
        run: bun run --filter @eneo/ui build

      # Pin to match apps/web's @playwright/test dependency; a bare
      # `bun x playwright` fetches the latest and installs a browser build the
      # pinned runner can't find ("Executable doesn't exist").
      - name: Install Playwright Chromium
        working-directory: frontend/apps/web
        run: bun x playwright@1.61.1 install --with-deps chromium

      # Build the production app up front so the Playwright webServer only has to
      # start `preview`. A full `vite build` inside the webServer's 180s timeout
      # is the root cause of the flaky "Timed out waiting from config.webServer":
      # its wall-clock straddles 180s on shared runners. SVELTE_KIT_OUT_DIR must
      # match playwright.config.ts so `preview` serves exactly this build; the
      # backend URLs are read at runtime (via $env/dynamic) so they don't affect
      # the artifact, but we set them to mirror the previous build environment.
      - name: Build web app for E2E
        working-directory: frontend/apps/web
        env:
          SVELTE_KIT_OUT_DIR: .svelte-kit-e2e
          NODE_OPTIONS: --max-old-space-size=8192
        run: bun run build

      - name: Wait for the E2E stack
        run: |
          for _ in $(seq 1 300); do
            [ -f "$RUNNER_TEMP/e2e-stack.exit" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/e2e-stack.log"
          [ "$(cat "$RUNNER_TEMP/e2e-stack.exit" 2>/dev/null)" = "0" ]

      - name: Run E2E tests
        working-directory: frontend/apps/web
        env:
          # The workflow owns the stack lifecycle, so Playwright must not manage it.
          E2E_MANAGE_STACK: "0"
          # Keep SSR and direct API helpers on one deterministic loopback path.
          E2E_BACKEND_URL: http://127.0.0.1:8124
          E2E_JWT_SECRET: ci-test-jwt-secret-not-for-production-0123456789 # matches the e2e-backend JWT_SECRET
        run: bun run test:e2e

      - name: Capture E2E stack diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p e2e-artifacts
          docker compose -f docker-compose.e2e.ci.yml ps --all \
            > e2e-artifacts/compose-ps.txt
          docker compose -f docker-compose.e2e.ci.yml logs \
            --no-color --timestamps \
            > e2e-artifacts/compose.log

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/apps/web/playwright-report
            e2e-artifacts
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop E2E stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.e2e.ci.yml down -v

  schema-drift:
    name: Schema drift
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        # uv downloads a prebuilt CPython from GitHub releases; that CDN
        # occasionally returns 504s. Retry with backoff so a transient
        # blip doesn't fail the whole run.
        run: |
          for attempt in 1 2 3 4 5; do
            if uv python install 3.11; then
              exit 0
            fi
            echo "::warning::uv python install failed (attempt $attempt/5); retrying in $((attempt * 10))s"
            sleep $((attempt * 10))
          done
          echo "::error::uv python install failed after 5 attempts"
          exit 1
        working-directory: backend

      - name: Install backend dependencies
        run: uv sync --python 3.11 --frozen --all-groups
        working-directory: backend

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: frontend

      # schema.d.ts is generated from the backend OpenAPI spec; nothing else keeps
      # it in sync, so a backend model change that skips regeneration silently
      # leaves the frontend types (and any ActionType-driven i18n guards) stale.
      - name: Dump backend OpenAPI spec
        run: uv run python -c "import json; from eneo.server.main import app; json.dump(app.openapi(), open('/tmp/openapi.gen.json', 'w'))"
        working-directory: backend

      - name: Regenerate schema.d.ts (eneo-js)
        run: |
          bun x openapi-typescript /tmp/openapi.gen.json -o src/types/schema.d.ts --default-non-nullable=false
          bun x prettier --write src/types/schema.d.ts
        working-directory: frontend/packages/eneo-js

      - name: Regenerate schema.d.ts (web-next)
        run: |
          bun x openapi-typescript /tmp/openapi.gen.json -o src/lib/api/schema.d.ts --default-non-nullable=false
          bun x prettier --write src/lib/api/schema.d.ts
        working-directory: frontend/apps/web-next

      - name: Fail on schema drift
        run: |
          STATUS=0
          for SCHEMA in \
            frontend/packages/eneo-js/src/types/schema.d.ts \
            frontend/apps/web-next/src/lib/api/schema.d.ts; do
            if git diff --quiet -- "$SCHEMA"; then
              echo "$SCHEMA is in sync with the backend OpenAPI spec."
              continue
            fi
            STATUS=1

            echo "::error file=$SCHEMA::Out of sync with the backend OpenAPI spec — regenerate and commit it."

            # Render the drift in the job Summary so it's visible without opening raw logs.
            {
              echo "## ❌ schema.d.ts drift detected"
              echo ""
              echo "\`$SCHEMA\` does not match the backend OpenAPI spec."
              echo "Regenerate it (\`node update.js\` in eneo-js / \`bun run gen:api\` in web-next against a backend, or the offline \`app.openapi()\` regen) and commit the result."
              echo ""
              echo "<details><summary>Diff — committed (red) vs. regenerated/expected (green)</summary>"
              echo ""
              echo '```diff'
              git diff --no-color -- "$SCHEMA"
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"

            # Also surface it in the step log, collapsed.
            echo "::group::$SCHEMA diff (committed vs. regenerated)"
            git diff -- "$SCHEMA"
            echo "::endgroup::"
          done
          exit $STATUS

  docker-builds:
    name: Docker builds (${{ matrix.image }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.docker_backend == 'true' ||
      needs.changes.outputs.docker_frontend == 'true' ||
      needs.changes.outputs.docker_devcontainer == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            file: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
          - image: devcontainer
            context: ./.devcontainer
            file: ./.devcontainer/Dockerfile

    steps:
      - name: Checkout
        if: >-
          github.event_name != 'pull_request' ||
          (matrix.image == 'backend' && needs.changes.outputs.docker_backend == 'true') ||
          (matrix.image == 'frontend' && needs.changes.outputs.docker_frontend == 'true') ||
          (matrix.image == 'devcontainer' && needs.changes.outputs.docker_devcontainer == 'true')
        uses: actions/checkout@v4

      # The frontend production build needs more memory than the hosted runner
      # can provide without swap once it runs inside Docker. Keep this scoped to
      # the frontend image; the other images build within the runner's RAM.
      - name: Add swap for frontend image build
        if: >-
          matrix.image == 'frontend' &&
          (github.event_name != 'pull_request' || needs.changes.outputs.docker_frontend == 'true')
        run: |
          sudo fallocate --length 4G /mnt/eneo-frontend.swap
          sudo chmod 600 /mnt/eneo-frontend.swap
          sudo mkswap /mnt/eneo-frontend.swap
          sudo swapon /mnt/eneo-frontend.swap

      - name: Build Docker image
        if: >-
          github.event_name != 'pull_request' ||
          (matrix.image == 'backend' && needs.changes.outputs.docker_backend == 'true') ||
          (matrix.image == 'frontend' && needs.changes.outputs.docker_frontend == 'true') ||
          (matrix.image == 'devcontainer' && needs.changes.outputs.docker_devcontainer == 'true')
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --pull --file "${{ matrix.file }}" --tag "eneo-${{ matrix.image }}:ci" "${{ matrix.context }}"

  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - branch-policy
      - backend-quality
      - backend-tests
      - script-tests
      - route-metadata
      - user-facing
      - no-intric
      - frontend
      - frontend-e2e
      - schema-drift
      - docker-builds

    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BRANCH_POLICY_RESULT: ${{ needs.branch-policy.result }}
          BACKEND_QUALITY_RESULT: ${{ needs.backend-quality.result }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
          SCRIPT_TESTS_RESULT: ${{ needs.script-tests.result }}
          ROUTE_METADATA_RESULT: ${{ needs.route-metadata.result }}
          USER_FACING_RESULT: ${{ needs.user-facing.result }}
          NO_INTRIC_RESULT: ${{ needs.no-intric.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          FRONTEND_E2E_RESULT: ${{ needs.frontend-e2e.result }}
          SCHEMA_DRIFT_RESULT: ${{ needs.schema-drift.result }}
          DOCKER_BUILDS_RESULT: ${{ needs.docker-builds.result }}
        run: |
          failed=0

          check_result() {
            local name="$1"
            local result="$2"

            case "$result" in
              success|skipped)
                echo "$name: $result"
                ;;
              *)
                echo "::error::$name failed with result: $result"
                failed=1
                ;;
            esac
          }

          check_result "Change scope" "$CHANGES_RESULT"
          check_result "Branch policy" "$BRANCH_POLICY_RESULT"
          check_result "Backend quality" "$BACKEND_QUALITY_RESULT"
          check_result "Backend tests" "$BACKEND_TESTS_RESULT"
          check_result "Script tests" "$SCRIPT_TESTS_RESULT"
          check_result "Route metadata" "$ROUTE_METADATA_RESULT"
          check_result "User-facing section" "$USER_FACING_RESULT"
          check_result "No intric references" "$NO_INTRIC_RESULT"
          check_result "Frontend" "$FRONTEND_RESULT"
          check_result "Frontend E2E" "$FRONTEND_E2E_RESULT"
          check_result "Schema drift" "$SCHEMA_DRIFT_RESULT"
          check_result "Docker builds" "$DOCKER_BUILDS_RESULT"

          exit "$failed"
