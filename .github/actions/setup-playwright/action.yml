name: Set up Playwright Chromium
description: Install lockfile-matched Chromium from a per-version cache and its system libraries with bounded network retries.
inputs:
  working-directory:
    description: Workspace containing the installed Playwright CLI.
    default: frontend/apps/web
runs:
  using: composite
  steps:
    - name: Read the installed Playwright version
      id: playwright
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    # The cache holds the browser builds, not the system libraries they need.
    - name: Restore cached browsers
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium
    - name: Install system libraries
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        # apt retries transient downloads, and its timeouts catch a stalled
        # connection. The job's timeout-minutes bounds a mirror that is slow but
        # still progressing: a step deadline would kill downloads that would
        # have succeeded, and an interrupted dpkg transaction is unsafe to rerun.
        sudo tee /etc/apt/apt.conf.d/80-eneo-ci-network >/dev/null <<'APT'
        Acquire::Retries "2";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        APT
        bun run --bun playwright install-deps chromium
    - name: Install Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "30000"
      run: |
        for attempt in 1 2; do
          if timeout --kill-after=15s 120s bun run --bun playwright install chromium; then
            exit 0
          fi
          if [ "$attempt" -lt 2 ]; then
            echo "::warning::Chromium download failed; retrying once in 10 seconds."
            sleep 10
          fi
        done
        echo "::error::Chromium installation failed after two bounded attempts."
        exit 1
