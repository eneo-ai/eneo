name: Set up frontend dependencies
description: Use the production Node runtime, pinned Bun, and a shared package download cache.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 22.23.4
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-${{ hashFiles('frontend/bun.lock') }}
        restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-1.4.4-
    - name: Install locked workspace dependencies
      shell: bash
      working-directory: frontend
      run: timeout --kill-after=15s 300s bun install --frozen-lockfile
