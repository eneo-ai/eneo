name: Scan application image
description: Gate the exact candidate against distribution and upstream vulnerability data.
inputs:
  image:
    description: Locally built candidate image
    required: true
  component:
    description: Image owner (backend or frontend)
    required: true
  output-directory:
    description: Directory for raw reports
    required: true
outputs:
  sarif-ready:
    description: Both scanner reports were validated and SARIF was generated
    value: ${{ steps.report.outputs.sarif-ready }}
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/eneo-image-scanners"
        cd "$RUNNER_TEMP/eneo-image-scanners"
        curl --fail --location --retry 3 --output trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
        echo 'c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f  trivy.tar.gz' | sha256sum --check
        tar -xzf trivy.tar.gz trivy
        curl --fail --location --retry 3 --output grype.tar.gz https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_linux_amd64.tar.gz
        echo '38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26  grype.tar.gz' | sha256sum --check
        tar -xzf grype.tar.gz grype
        echo "$RUNNER_TEMP/eneo-image-scanners" >> "$GITHUB_PATH"
    - shell: bash
      id: scan
      env:
        IMAGE: ${{ inputs.image }}
        REPORT_DIRECTORY: ${{ inputs.output-directory }}
      run: |
        set -euo pipefail
        mkdir -p "$REPORT_DIRECTORY"
        trivy_status=0
        grype_status=0
        # Capture all severities. Scanner errors and vulnerability gates are
        # separate: only two complete reports may replace published alerts.
        trivy image --scanners vuln --exit-code 0 \
          --format json --output "$REPORT_DIRECTORY/trivy.json" "$IMAGE" || trivy_status=$?
        # Keep unfixed results and upstream CPE matches where Wolfi's feed is silent.
        grype "docker:$IMAGE" --add-cpes-if-none \
          --output json --file "$REPORT_DIRECTORY/grype.json" || grype_status=$?
        printf '{"trivy":%s,"grype":%s}\n' "$trivy_status" "$grype_status" > "$REPORT_DIRECTORY/scan-status.json"
    - name: Summarize evidence and enforce the HIGH/CRITICAL gate
      id: report
      if: always()
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        COMPONENT: ${{ inputs.component }}
        REPORT_DIRECTORY: ${{ inputs.output-directory }}
      run: python3 scripts/image_security_report.py --directory "$REPORT_DIRECTORY" --component "$COMPONENT" --image "$IMAGE"
