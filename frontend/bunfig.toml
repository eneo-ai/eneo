[install]
# Install only versions published at least 7 days ago (seconds).
minimumReleaseAge = 604800
# Exceptions: exact "pkg@x.y.z" only, each with an advisory link and a removal
# date at most 7 days out. Never a bare package name.
# @astryxdesign/*@0.7.5 (published 2026-10-31): the product owner chose 0.7.5
# on 2026-11-02. The packages carry SLSA provenance and npm signatures from the
# Astryx maintainers. Remove on 2026-11-07, when 0.7.5 clears the gate.
# https://github.com/meta/astryx/releases/tag/v0.7.5
minimumReleaseAgeExcludes = [
  "@astryxdesign/core@0.7.5",
  "@astryxdesign/theme-neutral@0.7.5",
  "@astryxdesign/cli@0.7.5",
]
