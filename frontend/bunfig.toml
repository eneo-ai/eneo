[install]
# Install only versions published at least 7 days ago (seconds).
minimumReleaseAge = 604800
# Exceptions: exact "pkg@x.y.z" only, each with an advisory link and a removal
# date at most 7 days out. Never a bare package name.
# @astryxdesign/*@0.7.12 (published 2026-11-10): the product owner chose the
# latest Astryx on 2026-11-10. The packages carry SLSA provenance and npm
# signatures from the Astryx maintainers (npm audit signatures: verified).
# Remove on 2026-11-17, when 0.7.12 clears the gate.
# https://github.com/meta/astryx/releases/tag/v0.7.12
minimumReleaseAgeExcludes = [
  "@astryxdesign/core@0.7.12",
  "@astryxdesign/theme-neutral@0.7.12",
  "@astryxdesign/cli@0.7.12",
]
