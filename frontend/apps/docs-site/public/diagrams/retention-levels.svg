<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">Retention period by level</title>
  <desc id="d">A period is chosen per level (organisation, space, assistant, app or flow, and under it the step and the recording as two separate branches) or not at all, and an unset period follows its parent; the space's period, chosen there or inherited from the organisation, is the cap, so a level below may shorten it but never extend it. In the example the organisation has no period, the space has 7 days, the flow has none and so gets 7 days, the transcription step has 24 hours and the recording 0 hours, removed when the run ends, while an unset recording period would keep the recording until its run is removed. Without a period, no age-based removal begins; leftover cleanup, empty-conversation cleanup, the module's limit for unsent recordings and removal of copies whose source has already been removed still apply.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="399" rx="12"/>

  <text class="s" x="24" y="40">A period is chosen per level or not at all. An unset period follows its parent.</text>

  <rect class="box" x="24" y="52" width="380" height="52" rx="8"/><text class="h" x="40" y="74">Organisation</text><text class="s" x="388" y="74" text-anchor="end">days</text><text class="s" x="40" y="95">example: no period</text>
  <path class="line" d="M214,104 V118"/>
  <rect class="key" x="24" y="118" width="380" height="52" rx="8"/><text class="h" x="40" y="140">Space</text><text class="s" x="388" y="140" text-anchor="end">days</text><text class="s" x="40" y="161">example: 7 days, the cap</text>
  <text class="h" x="428" y="140">The cap</text><text class="s" x="428" y="161">chosen here or inherited from the organisation</text>
  <path class="line" d="M214,170 V184"/>
  <rect class="box" x="24" y="184" width="380" height="52" rx="8"/><text class="h" x="40" y="206">Assistant, app or flow</text><text class="s" x="388" y="206" text-anchor="end">days</text><text class="s" x="40" y="227">example: flow, no period, so 7 days</text>

  <!-- two separate children of the flow -->
  <path class="line" d="M214,236 V250 M134,250 H454 M134,250 V264 M454,250 V264"/><circle class="dot" cx="214" cy="250" r="3.5"/>
  <rect class="box" x="24" y="264" width="220" height="74" rx="8"/><text class="h" x="40" y="288">Step</text><text class="s" x="228" y="288" text-anchor="end">hours</text><text class="s" x="40" y="310">example: transcription</text><text class="s" x="40" y="329">step, 24 hours</text>
  <rect class="box" x="268" y="264" width="372" height="74" rx="8"/><text class="h" x="284" y="288">Recording</text><text class="s" x="624" y="288" text-anchor="end">hours</text><text class="s" x="284" y="310">example: 0 hours, removed when the run ends</text><text class="m" x="284" y="329">unset: kept until its run is removed</text>

  <!-- below the cap -->
  <path class="line" d="M656,184 H664 V338 H656"/>
  <text class="h" x="680" y="240">Below the cap</text><text class="s" x="680" y="262">may shorten,</text><text class="s" x="680" y="281">never extend</text>

  <path class="lane" d="M24,354 H836"/>
  <text class="s" x="430" y="380" text-anchor="middle">Without a period, no age-based removal begins. Cleanup, and removal of copies whose source was removed, still apply.</text>
</svg>
