<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">Speech to text in a space that requires MFA</title>
  <desc id="d">The speech-to-text module signs in through Eneo, and the person signs in with MFA before recording, never during it. The flow lives in the space, so the audio, the transcript and the generated documents get the space as their home, and playback and download use the person's own sign-in, never a link anyone can use.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="399" rx="12"/>

  <!-- the person's path -->
  <rect class="box" x="24" y="24" width="232" height="84" rx="8"/><text class="h" x="140" y="50" text-anchor="middle">Module</text><text class="s" x="140" y="72" text-anchor="middle">speech to text;</text><text class="s" x="140" y="91" text-anchor="middle">records audio</text>
  <path class="edge" d="M140,108 V150"/>
  <rect class="pill" x="60" y="118" width="160" height="22" rx="4"/><text class="s" x="140" y="134" text-anchor="middle">signs in through Eneo</text>
  <rect class="warn" x="24" y="152" width="232" height="84" rx="8"/><text class="h" x="140" y="178" text-anchor="middle">Sign in with MFA</text><text class="s" x="140" y="200" text-anchor="middle">by the person, before</text><text class="s" x="140" y="219" text-anchor="middle">recording; never during it</text>
  <path class="edge" d="M256,194 H324 V88 H390"/>
  <rect class="pill" x="262" y="130" width="124" height="22" rx="4"/><text class="s" x="324" y="146" text-anchor="middle">session with MFA</text>

  <!-- the space -->
  <rect class="key" x="392" y="24" width="444" height="236" rx="8"/>
  <text class="h" x="408" y="50">Space that requires MFA</text>
  <rect class="box" x="408" y="64" width="412" height="48" rx="8"/><text class="h" x="614" y="94" text-anchor="middle">Flow with speech to text</text>
  <rect class="box" x="408" y="128" width="412" height="32" rx="8"/><text class="t" x="424" y="150">Audio</text><text class="s" x="804" y="150" text-anchor="end">home: this space</text>
  <rect class="box" x="408" y="172" width="412" height="32" rx="8"/><text class="t" x="424" y="194">Transcript</text><text class="s" x="804" y="194" text-anchor="end">home: this space</text>
  <rect class="box" x="408" y="216" width="412" height="32" rx="8"/><text class="t" x="424" y="238">Generated documents</text><text class="s" x="804" y="238" text-anchor="end">home: this space</text>

  <!-- reading it later -->
  <path class="edge" d="M614,260 V310"/>
  <rect class="pill" x="588" y="274" width="52" height="22" rx="4"/><text class="s" x="614" y="290" text-anchor="middle">read</text>
  <rect class="ok" x="392" y="312" width="444" height="64" rx="8"/><text class="h" x="614" y="338" text-anchor="middle">Playback and download</text><text class="s" x="614" y="359" text-anchor="middle">with the person's own sign-in</text>
  <rect class="gone" x="24" y="312" width="344" height="64" rx="8"/><text class="m" x="196" y="338" text-anchor="middle">A link anyone can use</text><text class="r" x="196" y="359" text-anchor="middle">not used</text>
</svg>
