<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="388" viewBox="0 0 860 388" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">A file's life with a home</title>
  <desc id="d">A file starts one of two ways: a generated file, a flow file or an upload that names its space has its home from the start, while an upload with no space is a draft, cleaned up if unused, that gets its home in the same step it is attached, and two spaces cannot both take it. Every file with a home is read in its home and checked every time; attaching it in another space is refused, and the person uploads it there instead.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="387" rx="12"/>

  <!-- start 1: created with a home -->
  <rect class="box" x="24" y="24" width="260" height="88" rx="8"/><text class="h" x="154" y="50" text-anchor="middle">Created with a home</text><text class="s" x="154" y="71" text-anchor="middle">generated and flow files,</text><text class="s" x="154" y="90" text-anchor="middle">an upload that names its space</text>
  <path class="edge" d="M284,68 H594"/>
  <rect class="pill" x="364" y="57" width="150" height="22" rx="4"/><text class="s" x="439" y="73" text-anchor="middle">home from the start</text>

  <!-- start 2: an upload with no space -->
  <rect class="box" x="24" y="144" width="220" height="112" rx="8"/><text class="h" x="134" y="170" text-anchor="middle">Draft</text><text class="s" x="134" y="191" text-anchor="middle">an upload with no space,</text><text class="s" x="134" y="210" text-anchor="middle">cleaned up if unused</text>
  <path class="edge" d="M244,200 H318"/>
  <rect class="pill" x="253" y="189" width="56" height="22" rx="4"/><text class="s" x="281" y="205" text-anchor="middle">attach</text>
  <rect class="box" x="320" y="144" width="240" height="112" rx="8"/><text class="h" x="440" y="170" text-anchor="middle">Attached</text><text class="s" x="440" y="191" text-anchor="middle">gets its home in the</text><text class="s" x="440" y="210" text-anchor="middle">same step; two spaces</text><text class="s" x="440" y="229" text-anchor="middle">cannot both take it</text>
  <path class="edge" d="M560,200 H594"/>

  <!-- every file with a home -->
  <rect class="key" x="596" y="24" width="240" height="232" rx="8"/><text class="h" x="716" y="131" text-anchor="middle">Read in its home</text><text class="s" x="716" y="152" text-anchor="middle">checked every time</text>
  <path class="edge" d="M716,256 V302"/>
  <rect class="pill" x="626" y="268" width="180" height="22" rx="4"/><text class="s" x="716" y="284" text-anchor="middle">attach in another space</text>
  <rect class="no" x="596" y="304" width="240" height="60" rx="8"/><text class="h" x="716" y="329" text-anchor="middle">Refused</text><text class="s" x="716" y="350" text-anchor="middle">upload it there instead</text>
</svg>
