<?xml version="1.0" encoding="UTF-8"?>
<!-- Same visual system as the MFA and file-home diagrams (canvas 860 wide, Inter 15-17, one meaning per colour:
     neutral = ordinary step, blue = the box the diagram turns on, green = allowed, red = refused, dashed grey = absent). -->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="348" viewBox="0 0 860 348" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">What a Skill can reach</title>
  <desc id="d">Left: while the Skill creator is on, it reads only the person's personal space and the current conversation, and web search, MCP tools, image generation and calculation are paused, so nothing it read leaves in a tool call meanwhile. Right: when a Skill runs in a shared space at classification level 3, its reference to web search attaches nothing by itself; the chat attaches only tools whose classification meets the space's, so a level 3 tool is attached and a level 2 web search is not.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="347" rx="12"/>
  <rect class="lane" x="24" y="24" width="394" height="300" rx="8"/><text class="h" x="221" y="52" text-anchor="middle">While a Skill is written</text>
  <rect class="lane" x="442" y="24" width="394" height="300" rx="8"/><text class="h" x="639" y="52" text-anchor="middle">A Skill runs in a level 3 shared space</text>
  <rect class="key" x="48" y="72" width="346" height="84" rx="8"/><text class="h" x="221" y="100" text-anchor="middle">Skill creator in the chat</text><text class="s" x="221" y="124" text-anchor="middle">reads only your personal space</text><text class="s" x="221" y="143" text-anchor="middle">and this conversation</text>
  <rect class="gone" x="48" y="188" width="160" height="84" rx="8"/><text class="h" x="128" y="216" text-anchor="middle">Web search</text><text class="s" x="128" y="240" text-anchor="middle">paused</text>
  <rect class="gone" x="234" y="188" width="160" height="84" rx="8"/><text class="h" x="314" y="216" text-anchor="middle">Other tools</text><text class="s" x="314" y="240" text-anchor="middle">MCP, images,</text><text class="s" x="314" y="259" text-anchor="middle">calculation: paused</text>
  <text class="m" x="221" y="300" text-anchor="middle">Nothing leaves in a tool call meanwhile</text>
  <rect class="box" x="466" y="72" width="346" height="84" rx="8"/><text class="h" x="639" y="100" text-anchor="middle">The Skill's text</text><text class="s" x="639" y="124" text-anchor="middle">refers to web search;</text><text class="s" x="639" y="143" text-anchor="middle">a reference attaches nothing</text>
  <path class="line" d="M639,156 V172"/><path class="edge" d="M639,172 H546 V186"/><path class="edge" d="M639,172 H732 V186"/>
  <rect class="ok" x="466" y="188" width="160" height="84" rx="8"/><text class="h" x="546" y="216" text-anchor="middle">A level 3 tool</text><text class="s" x="546" y="240" text-anchor="middle">attached</text>
  <rect class="no" x="652" y="188" width="160" height="84" rx="8"/><text class="h" x="732" y="216" text-anchor="middle">Web search</text><text class="s" x="732" y="240" text-anchor="middle">level 2:</text><text class="s" x="732" y="259" text-anchor="middle">not attached</text>
  <text class="m" x="639" y="300" text-anchor="middle">Tools must meet the space's level</text>
</svg>
