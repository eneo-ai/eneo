<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">Who gets into a space that requires MFA</title>
  <desc id="d">At the entrance check of a space that requires MFA, someone who has got hold of only the password is stopped because the second factor is missing, while the person themself, with the password and the second factor, is let in; which methods count as a second factor is decided at the identity provider.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="311" rx="12"/>

  <!-- someone who has only the password -->
  <circle class="line" cx="42" cy="80" r="10"/><path class="line" d="M24,118 Q24,96 42,96 Q60,96 60,118 Z"/>
  <text class="h" x="72" y="92">Someone else</text><text class="s" x="72" y="113">got hold of the password</text>
  <path class="edge" d="M256,96 H446"/>
  <rect class="pill" x="293" y="85" width="116" height="22" rx="4"/><text class="s" x="351" y="101" text-anchor="middle">password only</text>
  <text class="m" x="526" y="48" text-anchor="middle">entrance check</text>
  <rect class="no" x="448" y="64" width="156" height="64" rx="8"/><text class="h" x="526" y="90" text-anchor="middle">Stopped</text><text class="s" x="526" y="111" text-anchor="middle">no second factor</text>

  <!-- the person themself -->
  <circle class="line" cx="42" cy="176" r="10"/><path class="line" d="M24,214 Q24,192 42,192 Q60,192 60,214 Z"/>
  <text class="h" x="72" y="188">The person themself</text><text class="s" x="72" y="209">has both</text>
  <path class="edge" d="M256,192 H626"/>
  <rect class="pill" x="341" y="181" width="204" height="22" rx="4"/><text class="s" x="443" y="197" text-anchor="middle">password and second factor</text>

  <!-- the space -->
  <rect class="key" x="628" y="24" width="208" height="206" rx="8"/>
  <text class="h" x="644" y="50">Space that</text><text class="h" x="644" y="70">requires MFA</text>
  <rect class="box" x="644" y="86" width="176" height="34" rx="8"/><text class="t" x="732" y="108" text-anchor="middle">Conversations</text>
  <rect class="box" x="644" y="132" width="176" height="34" rx="8"/><text class="t" x="732" y="154" text-anchor="middle">Flows and runs</text>
  <rect class="box" x="644" y="178" width="176" height="34" rx="8"/><text class="t" x="732" y="200" text-anchor="middle">Speech to text</text>

  <path class="lane" d="M24,256 H836"/>
  <text class="s" x="430" y="286" text-anchor="middle">Which methods count as a second factor is decided at the identity provider.</text>
</svg>
