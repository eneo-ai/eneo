<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">The entrance check</title>
  <desc id="d">Every call from the web, a module or a key goes through one entrance check that finds the space it touches; the call is let in if the space does not require MFA or if a person's session has MFA, a person's session without MFA is answered "sign in with MFA", and a call with no person behind it (an API key, access code or widget visitor) gets a typed refusal.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="363" rx="12"/>

  <rect class="box" x="24" y="24" width="142" height="84" rx="8"/><text class="h" x="95" y="50" text-anchor="middle">A call</text><text class="s" x="95" y="71" text-anchor="middle">from web,</text><text class="s" x="95" y="90" text-anchor="middle">module or key</text>
  <path class="edge" d="M166,66 H210"/>
  <rect class="key" x="210" y="24" width="184" height="84" rx="8"/><text class="h" x="302" y="50" text-anchor="middle">Which space does</text><text class="h" x="302" y="70" text-anchor="middle">it touch?</text><text class="s" x="302" y="92" text-anchor="middle">one map for everything</text>
  <path class="edge" d="M394,66 H438"/>
  <rect class="box" x="438" y="24" width="180" height="84" rx="8"/><text class="h" x="528" y="61" text-anchor="middle">Does the space</text><text class="h" x="528" y="81" text-anchor="middle">require MFA?</text>

  <!-- the space does not require MFA -->
  <path class="edge" d="M618,66 H674"/>
  <rect class="pill" x="630" y="55" width="32" height="22" rx="4"/><text class="s" x="646" y="71" text-anchor="middle">no</text>
  <rect class="ok" x="676" y="24" width="160" height="316" rx="8"/><text class="h" x="756" y="188" text-anchor="middle">Let in</text>

  <!-- it does: who is behind the call? -->
  <path class="edge" d="M528,108 V150"/>
  <rect class="pill" x="511" y="118" width="34" height="22" rx="4"/><text class="s" x="528" y="134" text-anchor="middle">yes</text>
  <rect class="box" x="438" y="152" width="180" height="64" rx="8"/><text class="h" x="528" y="179" text-anchor="middle">Is a person</text><text class="h" x="528" y="199" text-anchor="middle">behind the call?</text>
  <path class="edge" d="M438,184 H396"/>
  <rect class="pill" x="401" y="173" width="32" height="22" rx="4"/><text class="s" x="417" y="189" text-anchor="middle">no</text>
  <rect class="no" x="24" y="144" width="370" height="80" rx="8"/><text class="h" x="209" y="170" text-anchor="middle">Typed refusal</text><text class="s" x="209" y="191" text-anchor="middle">API key, access code or widget</text><text class="s" x="209" y="210" text-anchor="middle">visitor: cannot show MFA</text>

  <!-- a person: does the session have MFA? -->
  <path class="edge" d="M528,216 V274"/>
  <rect class="pill" x="511" y="234" width="34" height="22" rx="4"/><text class="s" x="528" y="250" text-anchor="middle">yes</text>
  <rect class="box" x="438" y="276" width="180" height="64" rx="8"/><text class="h" x="528" y="303" text-anchor="middle">Does the session</text><text class="h" x="528" y="323" text-anchor="middle">have MFA?</text>
  <path class="edge" d="M618,308 H674"/>
  <rect class="pill" x="629" y="297" width="34" height="22" rx="4"/><text class="s" x="646" y="313" text-anchor="middle">yes</text>
  <path class="edge" d="M438,308 H396"/>
  <rect class="pill" x="401" y="297" width="32" height="22" rx="4"/><text class="s" x="417" y="313" text-anchor="middle">no</text>
  <rect class="warn" x="210" y="276" width="184" height="64" rx="8"/><text class="h" x="302" y="314" text-anchor="middle">Sign in with MFA</text>
</svg>
