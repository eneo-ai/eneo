<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="398" viewBox="0 0 860 398" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">The order of the retention work</title>
  <desc id="d">On develop the error code and preview answer come before the space caps, and attachment names can land at any time; on the Flows branch the engine comes first, then leftover cleanup, authoring chats and the flow run period, which also needs the error code, followed by the step period and the recording, and then, in the speech-to-text module, its local stores together with its MFA work. The normal route then merges Flows into develop once the whole Flows lane and, from the MFA epic, the entrance check and flows that follow the space are done, and the final test follows with the provider check, on a version that also holds the two develop tasks, or can instead run on a named version of the Flows branch that holds the same prerequisites.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="397" rx="12"/>

  <!-- on develop -->
  <text class="h" x="24" y="36">On develop</text>
  <rect class="box" x="24" y="46" width="224" height="80" rx="8"/><text class="h" x="136" y="81" text-anchor="middle">Error code</text><text class="s" x="136" y="102" text-anchor="middle">and preview answer</text>
  <path class="edge" d="M248,86 H272"/>
  <rect class="box" x="272" y="46" width="168" height="80" rx="8"/><text class="h" x="356" y="72" text-anchor="middle">Space caps</text><text class="s" x="356" y="93" text-anchor="middle">assistants and apps;</text><text class="s" x="356" y="112" text-anchor="middle">organisation's page</text>
  <rect class="box" x="464" y="46" width="176" height="80" rx="8"/><text class="h" x="552" y="81" text-anchor="middle">Attachment names</text><text class="s" x="552" y="102" text-anchor="middle">out of app audit rows</text>

  <!-- on the Flows branch; the frame has a gap where the error code arrow enters -->
  <text class="h" x="24" y="158">On the Flows branch</text>
  <path class="lane" d="M232,168 H628 A12,12 0 0 1 640,180 V344 A12,12 0 0 1 628,356 H36 A12,12 0 0 1 24,344 V180 A12,12 0 0 1 36,168 H216"/>
  <path class="edge" d="M224,126 V194"/>
  <rect class="box" x="36" y="180" width="120" height="76" rx="8"/><text class="h" x="96" y="206" text-anchor="middle">Engine</text><text class="s" x="96" y="227" text-anchor="middle">into the</text><text class="s" x="96" y="246" text-anchor="middle">Flows branch</text>
  <path class="edge" d="M156,218 H180"/>
  <rect class="box" x="180" y="194" width="152" height="48" rx="8"/><text class="h" x="256" y="224" text-anchor="middle">Flow run period</text>
  <path class="edge" d="M332,218 H356"/>
  <rect class="box" x="356" y="194" width="120" height="48" rx="8"/><text class="h" x="416" y="224" text-anchor="middle">Step period</text>
  <path class="edge" d="M476,218 H500"/>
  <rect class="box" x="500" y="194" width="104" height="48" rx="8"/><text class="h" x="552" y="224" text-anchor="middle">Recording</text>
  <path class="edge" d="M96,256 V284"/>
  <path class="edge" d="M96,268 H288 V284"/><circle class="dot" cx="96" cy="268" r="3.5"/>
  <rect class="box" x="36" y="284" width="152" height="48" rx="8"/><text class="h" x="112" y="314" text-anchor="middle">Leftover cleanup</text>
  <rect class="box" x="212" y="284" width="152" height="48" rx="8"/><text class="h" x="288" y="314" text-anchor="middle">Authoring chats</text>
  <path class="edge" d="M552,242 V284"/>
  <rect class="box" x="396" y="284" width="208" height="60" rx="8"/><text class="h" x="500" y="309" text-anchor="middle">Module's local stores</text><text class="s" x="500" y="330" text-anchor="middle">in the module; its MFA work</text>

  <!-- needed from the MFA epic -->
  <rect class="box" x="664" y="46" width="172" height="80" rx="8"/><text class="h" x="750" y="72" text-anchor="middle">MFA epic</text><text class="s" x="750" y="93" text-anchor="middle">entrance check; flows</text><text class="s" x="750" y="112" text-anchor="middle">that follow the space</text>
  <path class="edge" d="M750,126 V170"/>

  <!-- then -->
  <text class="h" x="664" y="158">Then</text>
  <path class="edge" d="M640,200 H664"/><circle class="dot" cx="640" cy="200" r="3.5"/>
  <rect class="box" x="664" y="170" width="172" height="60" rx="8"/><text class="h" x="750" y="195" text-anchor="middle">Merge Flows</text><text class="s" x="750" y="216" text-anchor="middle">into develop</text>
  <path class="edge" d="M750,230 V254"/>
  <rect class="key" x="664" y="254" width="172" height="48" rx="8"/><text class="h" x="750" y="274" text-anchor="middle">Final test</text><text class="s" x="750" y="293" text-anchor="middle">with both lanes done</text>
  <path class="edge" d="M750,326 V302"/>
  <rect class="box" x="664" y="326" width="172" height="48" rx="8"/><text class="h" x="750" y="356" text-anchor="middle">Provider check</text>
</svg>
