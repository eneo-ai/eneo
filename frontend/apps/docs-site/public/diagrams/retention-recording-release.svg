<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="364" viewBox="0 0 860 364" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">When a run ends, its recording is released</title>
  <desc id="d">When a run ends with any end status (completed, failed, cancelled or expired review), a wake-up fires after the commit, with the five-minute task as the fallback, and the recording's content and live transcript are released as one unit: playback answers 410 at once and the file is listed as content_purged, and object storage confirms the bytes are gone a little later. A hold, or another run that still needs the file, keeps it.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="363" rx="12"/>

  <rect class="box" x="24" y="40" width="180" height="116" rx="8"/><text class="h" x="114" y="66" text-anchor="middle">Run ends</text><text class="s" x="114" y="87" text-anchor="middle">any end status:</text><text class="s" x="114" y="106" text-anchor="middle">completed, failed,</text><text class="s" x="114" y="125" text-anchor="middle">cancelled or</text><text class="s" x="114" y="144" text-anchor="middle">expired review</text>
  <path class="edge" d="M204,88 H226"/>
  <rect class="box" x="228" y="40" width="180" height="116" rx="8"/><text class="h" x="318" y="76" text-anchor="middle">Wake-up</text><text class="s" x="318" y="97" text-anchor="middle">fires after the commit;</text><text class="s" x="318" y="116" text-anchor="middle">the five-minute task</text><text class="s" x="318" y="135" text-anchor="middle">is the fallback</text>
  <path class="edge" d="M408,88 H430"/>
  <rect class="key" x="432" y="40" width="200" height="96" rx="8"/><text class="h" x="532" y="66" text-anchor="middle">Released</text><text class="s" x="532" y="87" text-anchor="middle">recording and live</text><text class="s" x="532" y="106" text-anchor="middle">transcript, all parts</text><text class="s" x="532" y="125" text-anchor="middle">as one unit</text>
  <path class="edge" d="M532,136 V158"/>
  <rect class="box" x="432" y="160" width="200" height="72" rx="8"/><text class="h" x="532" y="185" text-anchor="middle">At once</text><text class="s" x="532" y="206" text-anchor="middle">playback answers 410;</text><text class="s" x="532" y="225" text-anchor="middle">listed as content_purged</text>
  <path class="edge" d="M632,88 H654"/>
  <rect class="box" x="656" y="40" width="180" height="96" rx="8"/><text class="h" x="746" y="66" text-anchor="middle">A little later</text><text class="s" x="746" y="87" text-anchor="middle">object storage</text><text class="s" x="746" y="106" text-anchor="middle">confirms the bytes</text><text class="s" x="746" y="125" text-anchor="middle">are gone</text>

  <!-- the exception -->
  <path class="edge" d="M318,156 V254"/>
  <rect class="pill" x="244" y="183" width="148" height="44" rx="4"/><text class="s" x="318" y="201" text-anchor="middle">a hold, or another</text><text class="s" x="318" y="219" text-anchor="middle">run needs the file</text>
  <rect class="ok" x="228" y="256" width="180" height="56" rx="8"/><text class="h" x="318" y="280" text-anchor="middle">Kept</text><text class="s" x="318" y="300" text-anchor="middle">nothing is released</text>

  <path class="edge" d="M24,340 H836"/>
  <rect class="pill" x="768" y="329" width="44" height="22" rx="4"/><text class="s" x="790" y="345" text-anchor="middle">time</text>
</svg>
