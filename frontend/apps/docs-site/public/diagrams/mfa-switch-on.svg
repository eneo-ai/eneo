<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="328" viewBox="0 0 860 328" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">Switching on MFA for a space</title>
  <desc id="d">When an administrator switches on MFA for a space, Eneo first checks that everything in the space is protected. If it is, the requirement applies to everything in the space; if not, the switch is refused with a reason the administrator can act on, such as a file also used in another space, and they can switch it on again once it is fixed.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="327" rx="12"/>

  <rect class="box" x="24" y="32" width="176" height="60" rx="8"/><text class="h" x="112" y="57" text-anchor="middle">Switch on MFA</text><text class="s" x="112" y="78" text-anchor="middle">for the space</text>
  <path class="edge" d="M200,62 H248"/>
  <rect class="key" x="248" y="24" width="224" height="76" rx="8"/><text class="h" x="360" y="50" text-anchor="middle">Eneo checks the space</text><text class="s" x="360" y="71" text-anchor="middle">is everything in it</text><text class="s" x="360" y="90" text-anchor="middle">protected?</text>
  <path class="edge" d="M472,62 H548"/>
  <rect class="pill" x="493" y="51" width="34" height="22" rx="4"/><text class="s" x="510" y="67" text-anchor="middle">yes</text>
  <rect class="ok" x="548" y="24" width="288" height="76" rx="8"/><text class="h" x="692" y="50" text-anchor="middle">MFA is on</text><text class="s" x="692" y="71" text-anchor="middle">the requirement applies</text><text class="s" x="692" y="90" text-anchor="middle">to everything in the space</text>

  <path class="edge" d="M360,100 V198 H548"/>
  <rect class="pill" x="438" y="187" width="32" height="22" rx="4"/><text class="s" x="454" y="203" text-anchor="middle">no</text>
  <rect class="no" x="548" y="148" width="288" height="100" rx="8"/><text class="h" x="692" y="174" text-anchor="middle">No, with a reason</text><text class="s" x="692" y="195" text-anchor="middle">the administrator can act on,</text><text class="s" x="692" y="214" text-anchor="middle">for example a file that is</text><text class="s" x="692" y="233" text-anchor="middle">also used in another space</text>

  <path class="back" d="M692,248 V288 H112 V92"/>
  <rect class="pill" x="312" y="277" width="180" height="22" rx="4"/><text class="s" x="402" y="293" text-anchor="middle">fix and switch on again</text>
</svg>
