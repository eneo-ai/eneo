<?xml version="1.0" encoding="UTF-8"?>
<!-- Visual system shared by the eight diagrams in this folder.
     Canvas: 860 wide, 400 tall or less, opaque background with a 1px border and radius 12, so text stays readable on any page colour.
     Layout: 24px outer margin; boxes radius 8, aligned in rows and columns with gaps of 24 or more; reading starts top left and runs right, then down.
     Strokes: box 1.5; key box 2; arrows 1.5 with one neutral arrowhead; dashes 6 4.
     Type: Inter, Segoe UI, Helvetica, Arial. Box name and panel or lane title 17 semibold; one-line label 16; sub-label 15;
       arrow label 15 on a pill in the canvas colour, so no line runs through text. 15 at 860 wide is 12.2 when shown 700 wide.
     Colour has one meaning everywhere (light fill and stroke / dark fill and stroke):
       neutral: an ordinary step. #f8f9fa #555 / #161b22 #8b949e
       blue: the box the diagram turns on. #e3f2fd #1565c0 / #0d2a45 #58a6ff
       green: let in, ok. #e8f5e9 #2e7d32 / #0f2a19 #3fb950
       amber: sign in with MFA, attention; the person can go on by acting now. #fff3e0 #b26a00 / #2b1d07 #d29922
       red: refused, or a gap today; the request does not succeed as made. #ffebee #c62828 / #2d1214 #f85149
       dashed grey: absent or bypassed. #999 / #6e7681
     Text #222 and #444 on white; #e6edf3 and #b8c0ca on #0d1117. The style block is byte-identical in all eight files. -->
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">MFA from the identity provider to the space</title>
  <desc id="d">The identity provider decides what counts as MFA, Eneo's sign-in applies the organisation's rule to the acr or amr value in the signed ID token, and the session stores yes or no once and never changes from no to yes. Each call that touches a space is let in or answered with "sign in with MFA".</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="311" rx="12"/>

  <!-- the chain -->
  <rect class="box" x="24" y="24" width="184" height="108" rx="8"/><text class="h" x="116" y="52" text-anchor="middle">Identity provider</text><text class="s" x="116" y="76" text-anchor="middle">signs the person in</text><text class="s" x="116" y="95" text-anchor="middle">and decides what</text><text class="s" x="116" y="114" text-anchor="middle">counts as MFA</text>
  <rect class="box" x="232" y="24" width="184" height="108" rx="8"/><text class="h" x="324" y="52" text-anchor="middle">Eneo sign-in</text><text class="s" x="324" y="76" text-anchor="middle">applies the</text><text class="s" x="324" y="95" text-anchor="middle">organisation's rule</text>
  <rect class="key" x="440" y="24" width="184" height="108" rx="8"/><text class="h" x="532" y="52" text-anchor="middle">Session</text><text class="s" x="532" y="76" text-anchor="middle">MFA yes or no;</text><text class="s" x="532" y="95" text-anchor="middle">never changes</text><text class="s" x="532" y="114" text-anchor="middle">from no to yes</text>
  <rect class="box" x="648" y="24" width="184" height="108" rx="8"/><text class="h" x="740" y="52" text-anchor="middle">Space</text><text class="s" x="740" y="76" text-anchor="middle">lets the call in</text><text class="s" x="740" y="95" text-anchor="middle">or answers</text><text class="s" x="740" y="114" text-anchor="middle">"sign in with MFA"</text>

  <!-- connectors under the boxes, labels on pills -->
  <path class="edge" d="M132,132 V172 H308 V134"/>
  <rect class="pill" x="150" y="150" width="140" height="44" rx="4"/><text class="s" x="220" y="168" text-anchor="middle">signed ID token</text><text class="s" x="220" y="186" text-anchor="middle">carries acr or amr</text>
  <path class="edge" d="M340,132 V172 H516 V134"/>
  <rect class="pill" x="360" y="150" width="136" height="44" rx="4"/><text class="s" x="428" y="168" text-anchor="middle">stores yes or no</text><text class="s" x="428" y="186" text-anchor="middle">once</text>
  <path class="edge" d="M548,132 V172 H724 V134"/>
  <rect class="pill" x="568" y="150" width="136" height="44" rx="4"/><text class="s" x="636" y="168" text-anchor="middle">each call that</text><text class="s" x="636" y="186" text-anchor="middle">touches a space</text>

  <!-- who answers for what -->
  <path class="lane" d="M24,232 H836"/>
  <rect class="pill" x="350" y="221" width="160" height="22" rx="4"/><text class="s" x="430" y="237" text-anchor="middle">who answers for what</text>
  <text class="h" x="158" y="266" text-anchor="middle">Identity provider</text><text class="s" x="158" y="287" text-anchor="middle">methods and how often</text>
  <text class="h" x="430" y="266" text-anchor="middle">Organisation</text><text class="s" x="430" y="287" text-anchor="middle">which value means MFA</text>
  <text class="h" x="702" y="266" text-anchor="middle">Eneo</text><text class="s" x="702" y="287" text-anchor="middle">compares and checks</text>
</svg>
