<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="296" viewBox="0 0 860 296" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">When the session ends during a recording</title>
  <desc id="d">A recording never asks for MFA. If the session ends during it, by sign-out, a disabled account or expiry, cloud transcription stops within a fixed bound while the recording continues locally, and the person then stops, signs in again and uploads.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="295" rx="12"/>

  <rect class="box" x="24" y="24" width="180" height="160" rx="8"/><text class="h" x="114" y="92" text-anchor="middle">Recording</text><text class="s" x="114" y="113" text-anchor="middle">no MFA question</text><text class="s" x="114" y="132" text-anchor="middle">while recording</text>

  <path class="mark" d="M220,24 V200 M220,256 V272"/>
  <rect class="warn" x="85" y="200" width="270" height="56" rx="8"/><text class="h" x="220" y="224" text-anchor="middle">Session ends</text><text class="s" x="220" y="245" text-anchor="middle">sign-out, disabled account, expiry</text>

  <rect class="no" x="236" y="24" width="216" height="64" rx="8"/><text class="h" x="344" y="50" text-anchor="middle">Cloud transcription</text><text class="s" x="344" y="71" text-anchor="middle">stops within a fixed bound</text>
  <rect class="ok" x="236" y="120" width="216" height="64" rx="8"/><text class="h" x="344" y="146" text-anchor="middle">Recording continues</text><text class="s" x="344" y="167" text-anchor="middle">locally</text>

  <path class="edge" d="M452,152 H480"/>
  <rect class="box" x="480" y="128" width="72" height="48" rx="8"/><text class="h" x="516" y="158" text-anchor="middle">Stop</text>
  <path class="edge" d="M552,152 H580"/>
  <rect class="box" x="580" y="128" width="144" height="48" rx="8"/><text class="h" x="652" y="158" text-anchor="middle">Sign in again</text>
  <path class="edge" d="M724,152 H752"/>
  <rect class="box" x="752" y="128" width="84" height="48" rx="8"/><text class="h" x="794" y="158" text-anchor="middle">Upload</text>

  <path class="edge" d="M24,272 H836"/>
  <rect class="pill" x="768" y="261" width="44" height="22" rx="4"/><text class="s" x="790" y="277" text-anchor="middle">time</text>
</svg>
