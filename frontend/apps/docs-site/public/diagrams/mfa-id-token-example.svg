<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="388" viewBox="0 0 860 388" role="img" aria-labelledby="t d" style="font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; color-scheme: light dark;">
  <title id="t">What Eneo reads in the ID token</title>
  <desc id="d">In a signed ID token with made-up values, Eneo compares the acr value (or, if the organisation chooses, amr instead) with the value the organisation has set to get MFA yes or no, while iss, sub, aud and email belong to the identity and token checks that come before the MFA rule, and auth_time is not used.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <style>
    .bg{fill:#ffffff;stroke:#d0d7de;stroke-width:1}
    .lane{fill:none;stroke:#d0d7de;stroke-width:1.5}
    .box{fill:#f8f9fa;stroke:#555;stroke-width:1.5}
    .key{fill:#e3f2fd;stroke:#1565c0;stroke-width:2}
    .ok{fill:#e8f5e9;stroke:#2e7d32;stroke-width:1.5}
    .warn{fill:#fff3e0;stroke:#b26a00;stroke-width:1.5}
    .no{fill:#ffebee;stroke:#c62828;stroke-width:1.5}
    .gone{fill:none;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .h{fill:#222;font-size:17px;font-weight:600}
    .t{fill:#222;font-size:16px}
    .s{fill:#444;font-size:15px}
    .m{fill:#6a6a6a;font-size:15px}
    .r{fill:#c62828;font-size:15px}
    .pill{fill:#ffffff}
    .edge{stroke:#555;stroke-width:1.5;fill:none;marker-end:url(#a)}
    .back{stroke:#555;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#a)}
    .line{stroke:#555;stroke-width:1.5;fill:none}
    .cut{stroke:#c62828;stroke-width:2;fill:none}
    .mark{stroke:#b26a00;stroke-width:2;fill:none;stroke-dasharray:6 4}
    .dot,.ah{fill:#555}
    @media (prefers-color-scheme: dark){
      .bg,.pill{fill:#0d1117}
      .bg,.lane{stroke:#30363d}
      .box{fill:#161b22;stroke:#8b949e}
      .key{fill:#0d2a45;stroke:#58a6ff}
      .ok{fill:#0f2a19;stroke:#3fb950}
      .warn{fill:#2b1d07;stroke:#d29922}
      .no{fill:#2d1214;stroke:#f85149}
      .gone{stroke:#6e7681}
      .h,.t{fill:#e6edf3}
      .s{fill:#b8c0ca}
      .m{fill:#8b949e}
      .r{fill:#ff7b72}
      .edge,.back,.line{stroke:#8b949e}
      .cut{stroke:#ff7b72}
      .mark{stroke:#d29922}
      .dot,.ah{fill:#8b949e}
    }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="859" height="387" rx="12"/>

  <!-- the token -->
  <rect class="box" x="24" y="24" width="420" height="282" rx="8"/>
  <text class="h" x="40" y="50">Signed ID token</text><text class="m" x="428" y="50" text-anchor="end">made-up values</text>
  <rect class="key" x="36" y="203" width="396" height="30" rx="8"/>
  <rect class="box" x="36" y="235" width="396" height="30" rx="8"/>
  <g style="font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;">
    <text class="t" x="48" y="86">"iss": "https://login.example.org",</text>
    <text class="t" x="48" y="118">"sub": "7f3c9e…",</text>
    <text class="t" x="48" y="150">"aud": "eneo",</text>
    <text class="t" x="48" y="182">"email": "person@example.org",</text>
    <text class="t" x="48" y="223">"acr": "https://example.org/loa/mfa",</text>
    <text class="t" x="48" y="255">"amr": ["pwd", "otp"],</text>
    <text class="m" x="48" y="287">"auth_time": …</text>
  </g>

  <!-- who the person is -->
  <path class="line" d="M452,70 H460 V190 H452"/>
  <text class="h" x="476" y="124">Identity and token checks</text><text class="s" x="476" y="145">done before the MFA rule</text>

  <!-- what Eneo compares -->
  <path class="edge" d="M444,218 H610"/>
  <rect class="pill" x="485" y="207" width="84" height="22" rx="4"/><text class="s" x="527" y="223" text-anchor="middle">acr value</text>
  <path class="edge" d="M444,250 H610"/>
  <rect class="pill" x="469" y="239" width="116" height="22" rx="4"/><text class="s" x="527" y="255" text-anchor="middle">or amr instead</text>
  <rect class="box" x="612" y="190" width="224" height="88" rx="8"/><text class="h" x="724" y="216" text-anchor="middle">Eneo compares</text><text class="s" x="724" y="238" text-anchor="middle">with the value the</text><text class="s" x="724" y="257" text-anchor="middle">organisation has set</text>
  <path class="edge" d="M724,278 V328"/>
  <rect class="pill" x="696" y="292" width="56" height="22" rx="4"/><text class="s" x="724" y="308" text-anchor="middle">gives</text>
  <rect class="box" x="612" y="330" width="224" height="34" rx="8"/><text class="h" x="724" y="353" text-anchor="middle">MFA yes or no</text>

  <text class="m" x="456" y="287">not used</text>
</svg>
