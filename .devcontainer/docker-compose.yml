version: "3.8"
services:
  eneo:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    ports:
      - "3000:3000"
      - "8123:8123"
    volumes:
      - ../:/workspace
      # Isolate .venv from host to prevent host-side uv/python from corrupting it
      - backend_venv:/workspace/backend/.venv
      # Mount Docker socket for testcontainers support
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker group is created dynamically in post-create.sh with the correct GID
    # This ensures it works on any system regardless of the host's docker GID

  db:
    image: pgvector/pgvector:pg13
    networks:
      - eneo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis
    networks:
      - eneo
    volumes:
      - redis_data:/data

  celery-worker-flows:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - RUN_AS_CELERY_WORKER=true
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  celery-beat-flows:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd /workspace/backend && ./run.sh"
    networks:
      - eneo
    environment:
      - RUN_AS_CELERY_BEAT=true
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  redis_data:
  backend_venv:

networks:
  eneo:
    name: eneo
