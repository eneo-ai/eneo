version: "3.8"
services:
  eneo:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      # Overrides any value in backend/.env (env vars beat dotenv in
      # pydantic-settings); the kravla service below runs with auth disabled
      - CRAWLER_SERVICE_URL=http://kravla:8080
    volumes:
      - ../:/workspace
      # Isolate .venv from host to prevent host-side uv/python from corrupting it
      - backend_venv:/workspace/backend/.venv
      # Mount Docker socket for testcontainers support
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker group is created dynamically in post-create.sh with the correct GID
    # This ensures it works on any system regardless of the host's docker GID

  db:
    image: pgvector/pgvector:pg13
    networks:
      - eneo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis
    networks:
      - eneo
    volumes:
      - redis_data:/data

  kravla:
    # External crawler service; the backend reaches it at http://kravla:8080
    # (set CRAWLER_SERVICE_URL=http://kravla:8080 in backend/.env).
    # Built from the kravla GitHub repo, pinned to a release tag on purpose -
    # bump deliberately after verifying a new release.
    build:
      context: https://github.com/eneo-ai/kravla.git#v0.4.0
    networks:
      - eneo
    environment:
      # Local dev only: run without bearer auth
      - KRAVLA_AUTH_DISABLED=true
    ports:
      # Exposed on the host for curl/debugging; stop any manually started
      # kravla instance on 8080 to avoid a port conflict
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  backend_venv:

networks:
  eneo:
    name: eneo
