services:
  eneo:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      # Optional operator-managed object storage. Leave these unset and
      # instead connect through Admin > Storage against the object-content
      # profile below: endpoint http://object-content:8333, signing region
      # local, bucket eneo-object-content-dev, and the profile's dev
      # credentials. post-start.sh prints these values when the profile is
      # running.
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      # Integration testcontainers join this checkout's Compose network rather
      # than a global network shared by every devcontainer.
      - ENEO_TEST_DOCKER_NETWORK=${COMPOSE_PROJECT_NAME}_eneo
      - ENEO_WEB_PORT=${ENEO_WEB_PORT:-3000}
      - ENEO_API_PORT=${ENEO_API_PORT:-8123}
      # Plain HTTP is fine for local development; production keeps the
      # HTTPS-only default. Container env wins over backend/.env, so override
      # this from the host environment if you need to test the refusal.
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP=${OBJECT_CONTENT_ALLOW_INSECURE_HTTP:-true}
      # Bundled tool runtime, run inside this container like the backend
      # (cd tool-runtime && bun run dev). Both processes read the same token;
      # Admin > Tools offers "Add bundled compute" at this URL.
      - TOOL_RUNTIME_URL=${TOOL_RUNTIME_URL:-http://localhost:3010}
      - TOOL_RUNTIME_TOKEN=${TOOL_RUNTIME_TOKEN:-local-development-only-tool-runtime-token}
    ports:
      - "${ENEO_WEB_PORT:-3000}:3000"
      - "${ENEO_API_PORT:-8123}:8123"
    volumes:
      - ../:/workspace
      # Isolate .venv from host to prevent host-side uv/python from corrupting it
      - backend_venv:/workspace/backend/.venv
      # Keep node_modules and the Turbopack dev cache on the VM's native FS,
      # not bind-mounted through VirtioFS — eliminates the host↔VM roundtrip
      # storm that otherwise pegs the file-sharing helper during dev/build.
      # (Bun hoists the real packages into frontend/node_modules; the
      # per-app/package node_modules are symlink farms and stay on the bind
      # mount.)
      - frontend_node_modules:/workspace/frontend/node_modules
      # Mount Docker socket for testcontainers support
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker group is created dynamically in post-create.sh with the correct GID
    # This ensures it works on any system regardless of the host's docker GID
  object-content:
    profiles:
      - object-content
    build:
      context: ../docker/seaweedfs
      dockerfile: Dockerfile
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
      - -s3.iam=false
    networks:
      - eneo
    environment:
      # SeaweedFS uses these conventional S3 gateway variable names. No AWS
      # service is selected or contacted.
      AWS_ACCESS_KEY_ID: ${OBJECT_CONTENT_ACCESS_KEY_ID:-eneo-dev-object-content}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_CONTENT_SECRET_ACCESS_KEY:-local-development-only-secret}
      S3_BUCKET: ${OBJECT_CONTENT_BUCKET:-eneo-object-content-dev}
    volumes:
      - object_content_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8333"

  db:
    image: pgvector/pgvector:pg13
    networks:
      - eneo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis
    networks:
      - eneo
    volumes:
      - redis_data:/data

  task-execution-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd /workspace/backend && .venv/bin/task-execution-worker"
    restart: unless-stopped
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      # The workers read the same object store as the backend; plain HTTP is
      # fine for local development (see the eneo service above).
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP=${OBJECT_CONTENT_ALLOW_INSECURE_HTTP:-true}
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  task-maintenance-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd /workspace/backend && .venv/bin/task-maintenance-worker"
    restart: unless-stopped
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      # The workers read the same object store as the backend; plain HTTP is
      # fine for local development (see the eneo service above).
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP=${OBJECT_CONTENT_ALLOW_INSECURE_HTTP:-true}
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  # Website crawls are delivered to their own ARQ queue (arq:crawler) and only
  # this role consumes it. Mirrors the crawler-worker service in
  # docs/deployment/docker-compose.yml: run.sh selects the crawler settings.
  # All three worker services restart until post-create.sh has finished
  # installing the shared .venv.
  crawler-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd /workspace/backend && exec ./run.sh"
    restart: unless-stopped
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - RUN_AS_WORKER=true
      - WORKER_ROLE=crawler
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP=${OBJECT_CONTENT_ALLOW_INSECURE_HTTP:-true}
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  frontend_node_modules:
  object_content_data:

networks:
  # Keep service DNS project-scoped so concurrent checkouts cannot resolve one
  # another's db or redis containers.
  eneo:
