version: "3.8"
services:
  eneo:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP
    ports:
      - "3000:3000"
      - "8123:8123"
    volumes:
      - ../:/workspace
      # Isolate .venv from host to prevent host-side uv/python from corrupting it
      - backend_venv:/workspace/backend/.venv
      # Mount Docker socket for testcontainers support
      - /var/run/docker.sock:/var/run/docker.sock
    # Docker group is created dynamically in post-create.sh with the correct GID
    # This ensures it works on any system regardless of the host's docker GID
  object-content:
    profiles:
      - object-content
    build:
      context: ../docker/seaweedfs
      dockerfile: Dockerfile
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
      - -s3.iam=false
    networks:
      - eneo
    environment:
      # SeaweedFS uses these conventional S3 gateway variable names. No AWS
      # service is selected or contacted.
      AWS_ACCESS_KEY_ID: ${OBJECT_CONTENT_ACCESS_KEY_ID:-eneo-dev-object-content}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_CONTENT_SECRET_ACCESS_KEY:-local-development-only-secret}
      S3_BUCKET: ${OBJECT_CONTENT_BUCKET:-eneo-object-content-dev}
    volumes:
      - object_content_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8333"

  db:
    image: pgvector/pgvector:pg13
    networks:
      - eneo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis
    networks:
      - eneo
    volumes:
      - redis_data:/data

  celery-worker-flows:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    networks:
      - eneo
    environment:
      - RUN_AS_CELERY_WORKER=true
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

  celery-beat-flows:
    build:
      context: .
      dockerfile: Dockerfile
    command: bash -lc "cd /workspace/backend && ./run.sh"
    networks:
      - eneo
    environment:
      - RUN_AS_CELERY_BEAT=true
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
    volumes:
      - ../:/workspace
      - backend_venv:/workspace/backend/.venv
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  redis_data:
  backend_venv:
  object_content_data:

networks:
  eneo:
    name: eneo
