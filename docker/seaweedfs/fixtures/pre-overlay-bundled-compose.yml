# Migration fixture for the bundled topology shipped before the object-content
# service moved from docker-compose.yml into its opt-in overlay. Keep this
# historical shape independent from the current overlay so the deployment
# smoke proves that the named volume survives the change in invocation.

services:
  object-content:
    image: ${ENEO_SEAWEEDFS_IMAGE:?Set the verified ghcr.io/eneo-ai/eneo-seaweedfs digest in .env}
    restart: unless-stopped
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -master.telemetry=false
      - -s3.iam=false
      - -master.volumeSizeLimitMB=${SEAWEEDFS_VOLUME_SIZE_LIMIT_MB:-30000}
      - -master.garbageThreshold=${SEAWEEDFS_GARBAGE_THRESHOLD:-0.3}
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_CONTENT_ACCESS_KEY_ID:?Set the object-content access key in .env}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_CONTENT_SECRET_ACCESS_KEY:?Set the object-content secret key in .env}
      S3_BUCKET: ${OBJECT_CONTENT_BUCKET:-eneo-object-content}
    volumes:
      - eneo_object_content_data:/data
    networks:
      - object_content_net
    expose:
      - "8333"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m

networks:
  object_content_net:
    driver: bridge
    internal: true

volumes:
  eneo_object_content_data:
