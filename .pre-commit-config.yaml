repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.3
    hooks:
      # Lint using project configuration (pyproject.toml)
      - id: ruff-check
        name: ruff
        args: [--fix]
        stages: [commit]
        files: ^backend/

  # Keep uv.lock in sync with pyproject.toml
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.8.22
    hooks:
      - id: uv-lock
        args: [--directory, backend]

  # Frontend: lint changed Svelte/TS/JS files
  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend-lint
        entry: bash -c 'cd frontend/apps/web && npx eslint --no-warn-ignored "${@/#frontend\/apps\/web\//}"' --
        language: system
        files: ^frontend/apps/web/src/.*\.(svelte|ts|js)$
        stages: [pre-commit]
