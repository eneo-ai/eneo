version: 2

goal:
  title: "Flow AI Builder maintainability and quality hardening"
  slug: "flow-ai-builder-maintainability-quality-hardening"
  kind: open_ended
  tranche: "Discover, peer-review, implement the first safe high-impact Flow AI Builder hardening slice, verify it, and audit whether the slice moves the codebase closer to a 9/10 maintainability bar."
  status: active

rules:
  pm_owns_state: true
  one_write_capable_task: true
  parallel_read_only_scouts_allowed: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  preserve_unrelated_dirty_files: true
  no_commit_without_owner_request: true
  no_push_without_owner_request: true

agents:
  scout: installed
  worker: installed
  judge: installed
  claude_peer_loop: "/Users/ccimen/.agents/skills/claude-peer-loop/scripts/claude_peer_loop.py"
  antigravity_peer_loop: "/Users/ccimen/.agents/skills/antigravity-peer-loop/scripts/antigravity_peer_loop.py"
  complexity_optimizer: "/Users/ccimen/.codex/skills/complexity-optimizer/SKILL.md"

active_task: null

scoring_target:
  dimensions:
    - Maintainability
    - Code Quality
    - Clean Architecture
    - Separation of Concerns
    - Single Source of Truth
    - Human Readability
    - Human Reviewability
  target_minimum_score: 9
  overall_score_rule: "minimum dimension score"

dirty_worktree_baseline:
  branch: "feature/refactor-flows-flowai"
  preserve_unrelated:
    - ".devcontainer/docker-compose.yml"
    - ".devcontainer/devcontainer-lock.json"
    - ".gitignore"
    - "AGENTS.md"
    - "PRODUCT.md"
    - "utvecklingssamtal.mp3"
  latest_commits_observed:
    - "3133e1ebf Improve flow package transfer errors"
    - "134b9d923 Route package knowledge bindings by local kind"
    - "4fd8ee3ab Fix flow package API examples and MCP errors"
    - "4e8a4b067 Clean up Flow branch hygiene noise"
    - "45b8220f4 Allow flow package draft import without knowledge bindings"
    - "e35c144e6 Remove low-value AI Builder eval tests"

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: xhigh
    objective: "Run the required parallel read-only Scout wave and produce evidence-backed findings for architecture, AI Builder output quality, runtime reliability, typed contracts/data model/API, tests/evals, comments/slop, and complexity."
    inputs:
      - "backend/src/intric/flows/ai_builder/**"
      - "Flow AI Builder API routes and schemas"
      - "backend/tests/**/*ai_builder*"
      - "docs/engineering/*.md"
      - "latest commits on feature/refactor-flows-flowai"
    constraints:
      - "Read-only."
      - "Do not edit implementation files."
      - "Use file:line evidence for concrete claims."
      - "Store large findings under .codex/artifacts/."
      - "Include current owner, proposed canonical home, delete/merge/rename/move path, tests required, risk/trade-off, and confidence."
    expected_output:
      - ".codex/artifacts/flow-ai-builder-maintainability-discovery.md"
      - ".codex/artifacts/flow-ai-builder-live-eval.md"
      - "Scout receipts summarized in this board"
      - "Candidate first implementation slices with allowed files and verification commands"
    scout_tracks:
      - "Architecture and canonical ownership"
      - "AI Builder output quality and LLM usage"
      - "Runtime reliability and Celery/worker boundaries"
      - "Typed contracts, API shape, and data model"
      - "Tests, evals, and regression coverage"
      - "Comments, naming, and AI slop"
      - "Time/space complexity and repeated-scan opportunities"
    receipt:
      completed_at: "2026-05-20"
      summary: "Completed parallel Scout wave across architecture, output quality, runtime reliability, API contracts, data model, tests, readability, and complexity. Discovery and live-eval artifacts created."
      artifacts:
        - ".codex/artifacts/flow-ai-builder-maintainability-discovery.md"
        - ".codex/artifacts/flow-ai-builder-live-eval.md"
      scout_agent_ids:
        architecture: "019e4758-e65a-7860-997e-4939bd50ff75"
        output_quality: "019e4758-e737-7cc3-a7ea-69675893eecc"
        runtime_reliability: "019e4758-e92b-7801-8c1e-1ac173e06f27"
        data_model: "019e4758-eb51-7d50-b9e9-bf8b772d54c3"
        api_contract: "019e4758-edb4-77d2-b551-2f91058e6806"
        tests: "019e4758-f068-7f33-bba8-c266e1576809"
        readability: "019e4758-f232-7592-a474-b519befd7481"
        complexity: "019e4758-f547-7941-bccc-18a0339ec1c4"

