version: 2

goal:
  title: "Flow Runtime And AI Builder Maintainability / Production Readiness"
  slug: "flow-runtime-ai-builder-maintainability"
  kind: open_ended
  tranche: "Backend-first maintainability and production-readiness hardening: fix P0 runtime/API risks, improve public API error contracts, type critical data boundaries, remove pre-production legacy/dead code after proof, and improve AI Builder material efficiency."
  status: active

context:
  branch: "feature/refactor-flows-flowai"
  repo_root: "/Users/ccimen/eneo/eneo"
  do_not_push: true
  stay_on_branch: "feature/refactor-flows-flowai"
  preserve_unrelated_dirty_files: true
  pre_production_no_live_users: true
  compatibility_policy: "Do not preserve legacy/fallback behavior by default; keep only after grep/test/fixture/migration proof that it protects intended current product behavior."
  codex_source_check: "docs/goals/flow-runtime-ai-builder-maintainability/notes/T000-codex-source-check.md"
  source_packets:
    - "docs/refactor/Chatgptanswer.md"
    - "docs/refactor/flow-ai-builder-production-readiness-review-packet.md"
    - "docs/refactor/flow-ai-builder-production-readiness-chatgpt-prompt.md"
    - "docs/refactor/flow-ai-builder-material-efficiency-review-handoff.md"
    - "docs/goals/flow-runtime-ai-builder-production-readiness/notes/T000-plan-synthesis.md"
  claude_findings_summary: "docs/goals/flow-runtime-ai-builder-maintainability/notes/T000-maintainability-review-findings.md"
  local_execution:
    app_container: "docker exec eneo-41ae93-eneo-1 <command>"
    db_container_psql: "docker exec -e PGPASSWORD=postgres eneo-41ae93-db-1 psql -U postgres -d postgres"
    postgres_env:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_HOST: "localhost"
      POSTGRES_DB: "postgres"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  tdd_red_before_p0_fix: true
  strict_pyright_changed_files: true
  no_push: true
  stay_on_current_branch: true
  local_commits_at_reviewable_intervals: true
  commit_message_must_be_human_readable: true
  commit_message_must_not_use_internal_planning_vocabulary: true
  no_catch_all_commits: true
  no_noisy_checkpoint_commits: true
  board_setup_commit_must_be_separate: true
  no_junk_artifacts_in_commits: true
  no_broad_rewrites: true
  no_shallow_pass_through_services: true
  no_legacy_retention_without_proof: true
  claude_plan_gate_required_for_ownership_contract_schema_or_test_uncertainty: true
  claude_commit_gate_required_for_p0_api_runtime_data_boundary_phases: true
  claude_self_review_allowed_for_low_risk_cleanup: true
  claude_full_retrospective_required_at_phase_boundary: true
  claude_review_required_before_phase_green_light: true
  claude_iteration_required_after_major_phase_or_decision: true
  claude_must_challenge_next_phase_before_green: true
  claude_green_no_blocks_for_correctness_ownership_types_tests_api_regression_data_loss_security: true
  claude_style_or_process_objections_can_be_overruled_with_evidence: true
  maintainability_score_rubric_required: true
  cleanup_entry_gate_required: true
  frontend_worker_requires_stable_backend_contract: true
  comments_explain_why_not_what: true
  public_api_errors_are_contracts: true
  frontend_error_states_follow_backend_contracts: true
  worker_receipt_must_include_maintainability_self_review: true
  worker_receipt_must_include_maintainability_rubric_score: true
  worker_receipt_must_include_relevant_anti_patterns_avoided: true
  no_new_any_or_cast_or_type_ignore_without_boundary_reason: true
  worker_receipt_must_include_diff_type_debt_counts: true
  worker_receipt_must_paste_added_or_changed_comments: true
  board_must_be_committed_before_goal_implementation: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: T019

confirmed_p0_candidates:
  - id: P0-required-step-inputs-omitted
    title: "Required runtime inputs are exposed by run contract but may be bypassed when step_inputs is omitted."
    likely_first_slice: true
    current_owner: "FlowRunService.create_run + flow_run_step_inputs + FlowRunContractService"
    proposed_owner: "Run-request validator at the published run-contract/service boundary."
    red_test_harness:
      - "HTTP integration test through the real Flow run creation route, using the repo's existing API test client/fixtures."
      - "Service-level test only as a supplement, not the sole proof."
    red_test_required: true
    maintainability_reason: "Aligns public contract, validation, idempotency, and API consumer behavior in one canonical path."
    excludes:
      - "Do not change successful create-run idempotency fingerprint canonicalization in this slice."
  - id: P0-review-edit-contract-validation
    title: "Review checkpoint edits may bypass output-contract validation."
    current_owner: "FlowRunService.edit_review_checkpoint + FlowRunRepository edit persistence + runtime/output_runtime.py"
    proposed_owner: "FlowRunService validates before persistence by directly reusing output_processing.validate_against_contract; no wrapper service."
    red_test_harness:
      - "Integration/service test that persists a review checkpoint, submits invalid edited payload, and proves checkpoint plus step result are unchanged."
      - "Unit parity test proving review-edit validation and runtime output validation reject the same contract violation."
    red_test_required: true
    maintainability_reason: "Prevents review path from becoming a second schema-validity source of truth."
  - id: P0-runtime-failure-persistence
    title: "Executor failure terminalization may lose persisted failed state."
    current_owner: "FlowExecutor + FlowRunTerminalizer + FlowRunRepository"
    proposed_owner: "Smallest proven failure transition that delegates terminal lifecycle to FlowRunTerminalizer and commits explicitly."
    red_test_harness:
      - "Integration test using a real database/session and fresh-session re-fetch after the executor failure path fully exits."
      - "Avoid AsyncMock-only proof for run, step result, attempt, or audit persistence."
    red_test_required: true
    maintainability_reason: "Reduces executor transaction-boundary fear and consolidates terminal lifecycle ownership."
  - id: P0-late-output-after-terminalization
    title: "Late provider success may overwrite or mutate terminalized run state."
    current_owner: "FlowExecutor + FlowRepository.save_step_result + FlowRunRepository + FlowRunTerminalizer"
    proposed_owner: "FlowRunRepository atomic complete-step-if-active guard; file-row replacement only after successful guard."
    red_test_harness:
      - "Integration race test with two sessions: one terminalizes the run while another attempts late success persistence."
      - "Assert terminal status, step result status, attempt status, and file rows from a fresh session."
    red_test_required: true
    maintainability_reason: "Makes lifecycle correctness impossible to bypass accidentally in future executor changes."
    implementation_shape:
      - "Repository-owned atomic SQL guard, not read-then-check."
      - "Guard must prevent both result update and result-file-row replacement when the run/attempt/result is no longer active."
      - "Executor-level post-provider CANCELLED check is not the canonical lifecycle guard; remove it or document a non-duplicative reason to keep it in the Worker receipt."
      - "If removing the executor CANCELLED branch, preserve or relocate its attempt-finalization/provenance behavior intentionally."

contract_change_candidates:
  - id: API-create-run-step-inputs-fingerprint-canonicalization
    severity: P1
    title: "Decide whether successful create-run requests with omitted step_inputs and empty step_inputs should share one idempotency fingerprint."
    current_owner: "FlowRunService._build_idempotency_fingerprint and create_run effective payload shaping"
    proposed_owner: "Run request canonicalization at the FlowRunService boundary"
    red_test_harness:
      - "Unit property/normalization test for create-run fingerprint input shape."
      - "HTTP idempotency-key test if public behavior changes."
    position: "Do not bundle into P0-required-step-inputs-omitted unless Judge proves it is required for that fix."

maintainability_findings:
  - id: API-golden-journey-missing
    severity: P1
    title: "No single public API golden proves a web app can run/review/fetch a flow without reading backend source."
    proposed_owner: "Flow API integration tests + OpenAPI contract tests"
    after: "first two P0s or immediately if touched endpoints need examples"
    acceptance:
      - "Client can inspect a published flow and discover runtime paths."
      - "Client can fetch run contract and identify required form fields, required file inputs, final output type, review steps, and template readiness."
      - "Missing required runtime input returns a typed documented HTTP error."
      - "Valid run request can be created from the contract."
      - "If review is present, client can fetch active checkpoint, submit invalid edit and receive typed error, submit valid edit, approve, and resume."
      - "Client can poll status and fetch final output/artifact/evidence."
      - "Every touched error body contains stable code, message, and useful context."
      - "Idempotency-key replay behavior is either asserted when touched or explicitly deferred to API-create-run-step-inputs-fingerprint-canonicalization."
  - id: JSONB-boundaries-typed
    severity: P1
    title: "Flow metadata and published definitions are still broad JSONB contracts with scattered readers."
    proposed_owner: "PublishedFlowDefinitionV1 / FlowMetadataV1 typed parsers"
    after: "P0s"
  - id: PREPROD-legacy-cleanup
    severity: P1
    title: "Pre-production legacy/fallback paths and tests should be removed after local proof, not preserved for hypothetical users."
    proposed_owner: "Per-feature owners; no generic cleanup owner"
    after: "API golden protects intended behavior"
    entry_gate:
      - "Cleanup is required by the active P0 fix."
      - "Public behavior/API golden test already protects intended replacement behavior."
      - "Scout proves target is source-dead and no current test/fixture/migration depends on it."
    proof_table_columns:
      - "Candidate"
      - "Intended replacement"
      - "Grep proof"
      - "Replacement behavior test path (or queued: <test name>)"
      - "Migration/seed implication"
      - "Decision"
    allowed_decisions:
      - "delete_now"
      - "delete_after_tests"
      - "delete_after_fixture_cleanup"
      - "keep"
  - id: AI-builder-material-efficiency
    severity: P1
    title: "Generated flows need measurable material routing and token/context efficiency, not only valid specs."
    proposed_owner: "Existing AI Builder source-material/dataflow owners; no new parallel material planner unless red test proves need"
    after: "runtime/API first P0s or when AI Builder touched"
  - id: comments-ai-slop-audit
    severity: P2
    title: "Remove verbose what-comments, internal planning vocabulary, decorative confidence prose, vague TODOs, and obsolete compatibility comments."
    proposed_owner: "Each touched slice; no standalone rewrite unless Scout finds widespread low-risk cleanup"
  - id: frontend-error-handling-followthrough
    severity: P1
    title: "Backend error contracts must map to visible frontend states after public API behavior stabilizes."
    proposed_owner: "Flow frontend run/review/error surfaces, selected by Scout after backend endpoint contract is stable"
    after: "API golden journey or any backend error contract change that changes frontend-visible behavior"
    entry_gate:
      - "Backend error contract for touched endpoint is stable and tested."
      - "Scout proves current UI cannot show the stable backend error code/message actionably, the path is part of API golden journey, or backend contract change would otherwise leave users with generic/misleading errors."
      - "Frontend Worker stays narrow: render existing backend error contract clearly; no Flow UI redesign."
  - id: lifecycle-method-naming-transaction-boundaries
    severity: P1
    title: "Runtime lifecycle method names and receipts should expose transaction and terminal-state invariants."
    proposed_owner: "FlowRunTerminalizer, FlowRunRepository lifecycle methods, and FlowRunService validation boundary"
    after: "during each P0 runtime/API fix"
    acceptance:
      - "Method names encode lifecycle invariant when a P0 touches runtime state."
      - "Worker receipt states whether new/changed lifecycle method commits, requires caller commit, or only validates."
      - "No wrapper method is added purely for naming if it does not clarify ownership."
  - id: review-edit-validator-callback-followup
    severity: P2
    title: "Review checkpoint edit currently performs one extra locked lifecycle read before persistence validation."
    proposed_owner: "FlowRunRepository.edit_review_checkpoint_payload plus FlowRunService edit validator closure"
    after: "Before the next review-lifecycle slice that adds another edit/approve/reject/resume precondition hook."
    acceptance:
      - "Repository keeps one locked lifecycle precondition path for edit persistence."
      - "Service can inject schema/application validation without repository importing output contract validation."
      - "Behavior tests still prove invalid edits do not mutate checkpoint, projection, revision, or outbox state."
  - id: review-edit-openapi-error-examples
    severity: P2
    title: "Review checkpoint edit 400 response documents multiple codes but only has one worked example."
    proposed_owner: "Flow run execution router OpenAPI response docs"
    after: "Next API documentation polish or public API golden journey slice."
    acceptance:
      - "400 response examples include both typed_io_contract_violation and flow_review_stale_revision."
      - "OpenAPI contract test asserts both examples remain present."

verify_first_findings:
  - id: error-payload-drift
    title: "Actual error payload drift from documented GeneralError."
    position: "Do not classify as confirmed until an HTTP integration test captures real response body divergence. Bundle with public API golden slice."
  - id: delete-candidates
    title: "Static delete candidates may be false positives."
    position: "Because Flows is pre-production, production DB proof is not required, but grep proof, test migration, fixture cleanup, and local migration/schema proof are required."
  - id: metadata-vs-published-definition-priority
    title: "FlowMetadataV1 vs PublishedFlowDefinitionV1 first after P0s."
    position: "Decide after P0s based on actual corruption/mismatch evidence and fear-of-change reduction."

