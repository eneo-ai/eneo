version: 2

goal:
  title: "Flows clean architecture"
  slug: "flows-clean-architecture-2026-05-25"
  kind: open_ended
  tranche: "Reconfirm current source evidence, implement the first safe verified Flow architecture slice, verify it, and audit before continuing toward canonical runtime ownership."
  status: active

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  preserve_unrelated_dirty_files: true
  no_commit_without_owner_request: true
  no_push_without_owner_request: true
  no_branch_mutation_without_owner_request: true
  peer_gate_before_non_trivial_architecture_change: true
  post_implementation_review_required_for_non_trivial_changes: true
  public_contract_changes_update_openapi_and_generated_client: true
  one_way_in_guard_tests_required: true
  human_decision_gate_before_product_data_changes: true
  no_runtime_draft_state_reads_after_contract_refactor: true
  step_behavior_and_output_format_are_separate_axes: true
  output_format_specs_own_output_type_policy: true
  delete_input_policy_unless_real_caller_requires_it: true
  published_snapshot_is_runtime_boundary: true
  no_flow_version_steps_without_real_query_need: true
  repositories_do_not_own_product_decisions: true
  flow_legacy_cleanup_is_evidence_gated: true
  compatibility_paths_require_deletion_trigger: true
  tests_removed_with_removed_behavior_only: true
  no_repo_wide_dead_code_cleanup: true

agents:
  scout: installed
  worker: installed
  judge: installed
  claude_peer_loop: "/Users/ccimen/.agents/skills/claude-peer-loop/scripts/claude_peer_loop.py"
  antigravity_peer_loop: "/Users/ccimen/.agents/skills/antigravity-peer-loop/scripts/antigravity_peer_loop.py"

scorecard:
  current_floor: 5
  target_floor: 9
  source: "ChatGPT Pro review plus local schema and architecture maps."
  scoring_ladder:
    floor_6: "Known normal-path bugs fixed; public Flow API errors consistent; tests reviewable enough to proceed."
    floor_7: "Published runtime contract canonical; frontend generated-contract fallbacks removed; core API journey contract-tested."
    floor_8: "Webhook delivery durable; step identity stable; runtime file lifecycle explicit; service-key permission matrix coherent."
    floor_9: "Long-term polish complete: typed public/lifecycle JSONB ownership, mature health/readiness, clean frontend state ownership, and unneeded compatibility paths deleted."
  dimensions:
    maintainability: 6
    code_quality: 5
    clean_architecture: 5
    separation_of_concerns: 5
    single_source_of_truth: 5
    human_readability: 6
    human_reviewability: 5
    data_integrity: 5
    api_consumer_dx: 6
    api_maintainer_dx: 5
    runtime_reliability: 5
    testability: 5
  notes:
    - "Overall score is the minimum dimension score."
    - "Do not chase 9/10 before the 7/8 foundations are complete."
    - "Do not mark complete until a Judge/PM audit verifies the strict score floor is at least 9/10."
    - "Published snapshot is the runtime boundary: strict typed JSON first, no flow_version_steps normalization without a real query need."
    - "Dead/legacy/compatibility cleanup is Flow-scoped and evidence-gated; do not delete legacy-looking live behavior without a deletion trigger."

