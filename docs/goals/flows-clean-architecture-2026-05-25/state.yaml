version: 2

goal:
  title: "Flows clean architecture"
  slug: "flows-clean-architecture-2026-05-25"
  kind: open_ended
  tranche: "Reconfirm current source evidence, implement the first safe verified Flow architecture slice, verify it, and audit before continuing toward canonical runtime ownership."
  status: active

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  preserve_unrelated_dirty_files: true
  no_commit_without_owner_request: true
  no_push_without_owner_request: true
  no_branch_mutation_without_owner_request: true
  peer_gate_before_non_trivial_architecture_change: true
  post_implementation_review_required_for_non_trivial_changes: true
  public_contract_changes_update_openapi_and_generated_client: true
  one_way_in_guard_tests_required: true
  human_decision_gate_before_product_data_changes: true
  no_runtime_draft_state_reads_after_contract_refactor: true
  step_behavior_and_output_format_are_separate_axes: true
  output_format_specs_own_output_type_policy: true
  delete_input_policy_unless_real_caller_requires_it: true
  published_snapshot_is_runtime_boundary: true
  no_flow_version_steps_without_real_query_need: true
  repositories_do_not_own_product_decisions: true
  flow_legacy_cleanup_is_evidence_gated: true
  compatibility_paths_require_deletion_trigger: true
  tests_removed_with_removed_behavior_only: true
  no_repo_wide_dead_code_cleanup: true
  reuse_before_inventing_required: true
  duplicate_logic_requires_canonical_owner: true
  new_parallel_paths_require_deletion_plan: true
  canonical_owner_search_required: true
  new_code_requires_owner_insufficiency_reason: true
  reuse_through_typed_owners_not_generic_helpers: true
  worker_consolidation_effect_required: true

worker_receipt_requirements:
  consolidation_effect:
    - "Reused existing owner"
    - "Logic moved from"
    - "Logic deleted"
    - "Duplicate path removed"
    - "New code added"
    - "Why existing owners were insufficient"
    - "Guard/test preventing duplicate logic from returning"
    - "Net Flow logic surface area: reduced | preserved | increased"
    - "If increased, why the increase is necessary"

