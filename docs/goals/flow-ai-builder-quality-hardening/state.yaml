      - "Use Claude peer loop before activating a Worker."
      - "Do not select a Worker unless allowed_files and verify are fully populated."
      - "Reject wholesale staging of the dirty draft."
      - "Do not allow structured-field-path loosening without explicit tests."
    expected_output:
