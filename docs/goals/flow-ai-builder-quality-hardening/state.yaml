      - "docs/goals/flow-ai-builder-quality-hardening/notes/T999-tranche-audit.md"
    constraints:
      - "Read-only."
      - "Do not stage or commit."
      - "Do not revert user/other-agent changes."
      - "Do not include unrelated dirty files."
      - "Specifically review the structured-field-path loosening before it is allowed into any phase."
      - "Classify backend/src/intric/flows/runtime/step_execution_runtime.py separately from create/dataflow."
    expected_output:
