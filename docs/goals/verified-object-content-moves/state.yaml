    constraints:
      - "Read-only."
      - "Verify exact paths and symbols in current source."
      - "Identify shared paths that require coordination before editing."
      - "Bound command output and record exact validation commands."
    expected_output:
      - "Canonical ownership and duplicate-path map"
      - "Persisted state and lifecycle candidates"
      - "Crash/retry and one-authority invariant matrix"
      - "Migration and real-integration test commands"
      - "Smallest allowed Worker scope and stop conditions"
    receipt:
      result: done
      summary: "Confirmed object_contents.storage_kind as authority; concrete backend composite FKs and the deferred exactly-one-backend trigger retain their exact meaning. Reuse capture/verification, content leases, publication reservations, reconciliation/orphan inventory, readiness, deployment-policy authority, and the single ARQ cron. Prefer one reusable per-content move intent plus bounded aggregate queries; a batch parent has no independent product lifecycle."
      evidence:
        - backend/src/eneo/database/tables/object_content_table.py
        - backend/alembic/versions/202607231200_split_object_content_backends.py
        - backend/src/eneo/object_content/content_service.py
        - backend/src/eneo/object_content/reconciliation.py
        - backend/src/eneo/object_content/reconciliation_repository.py
        - backend/src/eneo/object_content/runtime.py
        - backend/src/eneo/worker/object_content_tasks.py
        - backend/src/eneo/worker/routes.py
        - docs/deployment/OBJECT_CONTENT.md
      commands:
        - cmd: "cd backend && uv run alembic heads"
          status: "pass: one head 202607261700"
        - cmd: "focused target-capture and worker unit tests"
          status: "pass: 6 tests"
        - cmd: "real PostgreSQL and SeaweedFS upload/read/delete lifecycle"
          status: "pass: 1 test"
      risks:
        - "Prove the legal immediate-FK order delete source child, update parent authority, insert target child in real PostgreSQL."
        - "Object-store-to-inline staging may make the flip transaction too large; stop instead of weakening the owner fence if it cannot be short."
        - "A staged remote target is protected only by the existing publication reservation; a post-flip former remote key deliberately becomes an ordinary orphan for bounded deletion."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Challenge the frozen evidence and select the smallest owner-level implementation slice that can satisfy the move contract without duplicate authority or speculative machinery."
    inputs:
      - "T001 receipt"
      - "Claude plan pass"
    constraints:
      - "Read-only."
      - "Reject missing recovery, boundedness, or migration ownership."
    expected_output:
      - "Decision and invariant model"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred scope"
    receipt:
      result: done
      decision: "Proceed with one reusable move row per content, no batch entity, unchanged immediate composite FKs, and one delete-source -> update-parent -> insert-target authority-flip transaction."
      invariants:
        - "object_contents.storage_kind remains the sole read authority."
        - "Rollback exists before the flip and recovery is forward-only afterward."
        - "Inline-to-object deletes inline bytes in the verified flip; object-to-inline registers the old remote key with the existing bounded orphan-deletion owner."
        - "No backup BYTEA, second content row, former-copy field, recovery hold, or guaranteed post-flip rollback."
      smallest_schema:
        - "One transient object_content_moves row keyed by content_id with target_kind, pending/target_verified/failed state, nullable verified target-object fields, typed failure/retry facts, requesting actor, and timestamps. A successful flip records the durable audit event and deletes the intent in the same transaction so the progress query does not become permanent history."
        - "Reuse ObjectContents lease fields, publication reservations, deployment-policy CAS, inventory, orphan deletion, and audit events."
        - "Extend the existing audit events with one storage_moved type and typed requesting actor evidence; do not add history tables."
      pause: "Persist only a deployment-wide moves_paused bit in the existing policy singleton; serialize claim and flip against that row."
      eligibility: "Queue only available referenced content with no delete intent, source different from target, no active conflicting move, and target-size eligibility. Holds remain unchanged retention fences; a final-reference/state race blocks the flip with a typed result."
      concurrency: "At most one move per reconciliation run; the admin request count has its own explicit bound."
      review_corrections:
        - "Cross-run inline-to-object attempts re-reserve the staged key under the current owner, fully re-verify it, and consume the reservation in the flip."
        - "Run at most one move after all existing reconciliation phases so move work cannot starve or roll back earlier safety work. Existing SDK request budgets and renewable leases bound store operations without imposing a file-size business timeout."
        - "Read pause without holding the policy singleton lock through the flip; pause blocks new claims and allows at most one verified move to finish."
        - "Add a state-specific available-content move lease renewal and require an active nonterminal move in the storage guard."
        - "The storage guard permits only target_verified; object-to-inline reaches it inside the short flip after validating the captured target bytes."
      deferred:
        - "Admin Storage UI, generated client, localization, and operator documentation follow after the backend contract stabilizes."

