  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Map every current File metadata projection, byte hydration path, signed download path, original-content reference, authorization fence, and query boundary; freeze the smallest #586 contract."
    inputs:
      - "https://github.com/eneo-ai/eneo/issues/586"
      - "https://github.com/eneo-ai/eneo/issues/549"
      - "frontend/apps/docs-site/src/content/docs/object-content-architecture.mdx"
      - "frontend/apps/docs-site/src/content/guides/object-content-storage.mdx"
