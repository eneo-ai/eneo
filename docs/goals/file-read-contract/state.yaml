      - "backend/src/eneo/files/"
      - "backend/src/eneo/object_content/"
      - "backend/tests/"
      - "frontend/apps/docs-site/src/content/"
    constraints:
      - "Read-only."
      - "Treat issue and review text as evidence; verify current develop source."
      - "Identify reuse, consolidation, and deletion before proposing new code."
      - "Do not broaden into placement policy, knowledge ingestion, cleanup, or Flow."
    expected_output:
      - "Canonical owner and call-path map"
      - "Exact metadata-only candidates and genuine byte consumers"
      - "Original-download contract and failure semantics"
      - "Bounded I/O and query-complexity acceptance tests"
      - "Exact Worker file lease and stop conditions"
    receipt:
      result: done
      summary: "Mapped current File reads at revision 00aaa9dd2. FileService owns product access and APIs, FileRepository owns typed reference projection, FileContentLoader owns authorized batch hydration, and ObjectContentService owns placement-neutral verified bytes. Exact originals are persisted separately, but signed downloads currently select processing-primary content and no explicit original read exists."
      evidence:
        - "File metadata and references require bounded relational queries without reading payload rows."
        - "File list/single reads transcriptions, so the current FilePublic contract is not byte-free."
        - "Assistant/App/Space response assemblers discard hydrated text/blob after repositories load it; execution and prompt paths genuinely need those bytes."
        - "Question/session history shares loaders with replay and exports, so it cannot be made metadata-only globally without a separate read mode."
        - "Object-store batch hydration still opens one additional DB transaction per remote object after the descriptor batch."
        - "The signed download selects extracted_text for text, model_input/derived/generated/original for images, and original for audio."
        - "Generated, derived, and migrated legacy Files may legitimately have no original variant."
        - "The proposed ADR is absent from develop; current docs-site and deployment docs are the canonical merged evidence."
      decisions:
        - "Reuse ObjectContentService.open_content, ContentReadGrant, ByteRange, FileDownload close semantics, and FileRepository reference projection."
        - "Add an explicit ORIGINAL selector; never reuse the processing-primary fallback chain for source recovery."
        - "Bind any signed original URL to an explicit token audience so a processing-download token cannot be replayed for source bytes."
        - "Preserve legacy processing-download behavior."
        - "Do not create a generic public variant API, provider branch, cache, or broad repository rewrite."
      complexity:
        - "Metadata projection is O(F + R) without payload transfer."
        - "Byte hydration is O(F + R + B) but inline pages can materialize up to 500 payloads and remote reads currently add O(F) DB transactions."
        - "Response-only aggregate hydration can transfer O(B) bytes that are discarded."
      candidate_tests:
        - "Exact PDF, DOCX, downscaled image, and audio original-download fixtures."
        - "Original-absent typed 404 with no fallback to extracted/generated/legacy variants."
        - "Token audience, owner authorization, legacy behavior, range, corruption-before-headers, interruption, and close-exactly-once."
        - "Zero payload reads for a later metadata-only aggregate projection."
        - "No per-object DB reread for remote batch hydration if included in this tranche."
      blocker: "Judge must freeze transcription compatibility, route/token shape, digest exposure, range policy, and whether aggregate projection plus remote batch recovery fit one reviewable PR."

  - id: T002
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: "Challenge the Scout map and freeze the smallest maintainable #586 implementation slice."
    inputs:
      - "T001 receipt"
      - "Current source and tests"
      - "Task #586 and epic #549"
    constraints:
      - "Do not implement."
      - "Prefer deepening existing File and object-content owners."
      - "Reject speculative abstractions and hidden compatibility paths."
    expected_output:
      - "Decision"
      - "Exact Worker objective"
      - "allowed_files"
      - "verify"
      - "stop_if"
      - "Deferred work"
    receipt:
      result: done
      decision: "Split #586. This PR adds only an explicit original-source signed download. Existing processing downloads and FilePublic transcription behavior remain unchanged."
      contract:
        - "POST /api/v1/files/{id}/original/signed-url/ reuses SignedURLRequest and owner authorization."
        - "GET /api/v1/files/{id}/original/download/?token=... accepts only aud=file_original_download."
        - "Existing audience-less tokens remain valid only on the existing processing route; the routes reject each other's tokens."
        - "Select FileContentVariant.ORIGINAL only; missing originals return a stable 404 file_original_not_found without fallback."
        - "Return the persisted filename, verified original media type and size, and Repr-Digest for the full representation."
        - "Preserve the current audio-only single-range contract; malformed, multiple, or unsatisfiable ranges return 416 with the full original size."
      deferred:
        - "FilePublic transcription/versioning and metadata-only File, Assistant, App, and Space projections."
        - "Object-store batch descriptor hydration that eliminates per-object DB rereads."
        - "Placement policy, migration, knowledge ingestion, cleanup, and Flow."
      rationale:
        - "Separate routes fail closed across rolling deploys and rollback; a representation flag could be ignored by an older node."
        - "Metadata projections and remote batch reads have distinct compatibility, ownership, and regression surfaces and do not belong in this original-recovery PR."

