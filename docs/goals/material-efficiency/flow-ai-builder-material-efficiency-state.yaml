# Goal Maker v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "Flow AI Builder Material Efficiency and Binding Quality"
  slug: "flow-ai-builder-material-efficiency"
  kind: open_ended
  tranche: "Improve explicit material routing, binding efficiency, source-material preservation, and measurable context cost through successive safe verified slices."
  status: blocked

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  stay_on_current_branch: true
  commit_phase_boundaries_only: true
  never_push_without_owner_instruction: true
  no_secrets_or_eval_artifacts_in_commits: true
  red_test_before_fix: true
  no_all_previous_steps_band_aid: true
  no_parallel_material_planning_abstraction_without_evidence: true

agents:
  scout: installed
  worker: installed
  judge: installed

active_task: null

