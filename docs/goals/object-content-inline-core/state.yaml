        - "backend/src/eneo/worker/object_content_tasks.py"
        - "backend/tests/unittests/object_content/"
        - "backend/tests/integration/object_content/"
      evidence:
        - "81 object-content unit tests pass."
        - "63 real-dependency object-content integration tests pass, including SeaweedFS upload/read/range/multipart/corruption/delete/reconciliation and process recovery."
        - "Exact inline maximum passes and maximum-plus-one fails before persistence."
        - "Transient remote outage reports degraded readiness while inline/local work remains available; missing or foreign remote authority fails closed."
      commands:
