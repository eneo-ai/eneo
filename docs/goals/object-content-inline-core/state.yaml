    receipt:
      result: complete
      decision: complete
      summary: "Slice 1 satisfies the accepted optional-content architecture without producer cutover. The final publication transition is authorized: push this audit-only commit, require the final PR head checks to pass, mark PR #573 Ready, then post exactly /review."
      contract_evidence:
        - "Canonical owner: eneo.object_content owns one lifecycle and exhaustive dispatch; no second subsystem or provider registry was introduced."
        - "Ownership: PostgreSQL enforces one common control row, one matching backend row, and one first concrete reference."
