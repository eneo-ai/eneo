      - "backend/migrations/versions/*object_content*"
      - "backend/tests/integration/object_content/"
      - "backend/tests/integration/migrations/"
      - "backend/tests/unittests/object_content/"
    verify:
      - "Behavior-first schema and migration tests"
      - "Alembic one-head and upgrade/downgrade/re-upgrade"
      - "PostgreSQL ownership, reference, tombstone, and concurrency invariants"
      - "ORM/schema parity"
    stop_if:
      - "The migration cannot copy and verify existing remote rows before contracting old columns."
      - "A required change reaches a producer or public API."
      - "The closed storage-kind model needs a third backend."
    receipt:
      result: done
      summary: "Split common control facts from backend-owned bytes with a closed storage kind, copied and verified every legacy row into object_store_objects, added bounded inline_content_payloads, and enforced one matching backend plus exactly one first reference with deferred PostgreSQL fences."
      changed_files:
        - "backend/src/eneo/database/tables/object_content_table.py"
        - "backend/src/eneo/object_content/content.py"
        - "backend/src/eneo/object_content/content_repository.py"
        - "backend/src/eneo/object_content/reconciliation_repository.py"
        - "backend/alembic/versions/202607231200_split_object_content_backends.py"
        - "backend/tests/integration/migrations/test_object_content_backend_split.py"
        - "backend/tests/integration/object_content/test_storage_ownership.py"
      evidence:
        - "Populated PostgreSQL 13 upgrade/downgrade/re-upgrade preserves legacy remote descriptors and failure codes."
        - "Downgrade fails before mutation when any inline row exists."
        - "30 PostgreSQL integration tests pass for ownership, reference, lifecycle, and concurrency behavior."
        - "Fresh migration ORM parity now includes both backend tables."
      commands:
        - cmd: "CI-env uv run pytest -q tests/integration/object_content/test_storage_ownership.py tests/integration/object_content/test_reference_fence.py tests/integration/object_content/test_lifecycle.py"
          status: "pass: 30 PostgreSQL 13 integration tests"
        - cmd: "CI-env uv run pytest -m migration_isolation -q tests/integration/migrations/test_object_content_backend_split.py"
          status: "pass: populated upgrade/downgrade/re-upgrade and inline downgrade refusal"

