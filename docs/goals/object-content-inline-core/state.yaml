tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: high
    objective: "Audit the post-PR #560 object-content schema, service, runtime, migrations, tests, and documentation; freeze the smallest closed Slice 1 contract."
    inputs:
      - "docs/adr/object-content-and-knowledge-ingestion.md in the accepted design worktree"
      - "backend/src/eneo/object_content/"
      - "backend/src/eneo/database/tables/object_content_table.py"
      - "backend/migrations/versions/"
      - "backend/tests/"
      - "docs/deployment/object-content-storage.md"
      - "frontend/apps/docs-site/src/content/docs/object-content-storage.mdx"
    constraints:
      - "Read-only except for PM-owned goal files."
      - "Do not change producers, public APIs, generated SDKs, or frontend product code."
      - "Prefer existing owners and identify concrete consolidation/deletion work."
    expected_output:
      - "Current owner and dependency map"
      - "Frozen schema and service contract"
      - "First RED behavior test"
      - "Validation and rollback plan"
    receipt:
      result: done
      summary: "Confirmed that eneo.object_content is the correct owner, but its common row, repository, service, runtime, reconciliation, and docs still assume one mandatory remote byte backend. Froze Slice 1 around two closed storage kinds, split backend rows, one deferred reverse-ownership fence, exhaustive service dispatch, and capability-scoped remote health."
      evidence:
        - "origin/develop and branch base 71de15e5013a566a4a54875b0bd189f0d258e205"
        - "one Alembic head: 202607221700"
        - "object_contents currently owns object_key, multipart state, remote observation, and remote deletion"
        - "existing reference triggers already serialize content IDs, enforce same-transaction first ownership, and maintain reference_count"
        - "existing runtime disables the whole module without remote configuration and makes remote outage a global readiness failure"
        - "existing real-store suite owns qualified S3-compatible process, range, multipart, TLS, integrity, binding, and reconciliation behavior"
      decisions:
        - "Reuse and deepen ObjectContents, ObjectContentRepository, ObjectContentService, ObjectContentRuntime, and the existing reference/lifecycle triggers."
        - "Move remote-only facts to ObjectStoreObjects; add InlineContentPayloads for bounded BYTEA; keep common payload_deleted_at."
        - "Keep exactly one explicit StorageKind enum and one exhaustive service dispatch; do not add a port, registry, or provider branch."
        - "Keep tenant foreign keys and authorization fences required by current behavior, but add no tenant storage topology or policy."
        - "Treat absent object-store configuration as healthy inline mode; invalid partial configuration still fails startup; remote outage degrades only remote operations."
      commands:
        - cmd: "cd backend && uv run alembic heads"
          status: "pass: 202607221700 (head)"
        - cmd: "Docker availability"
          status: "pass: Docker 29.4.0 linux/arm64"
        - cmd: "CI-env uv run pytest -q tests/unittests/object_content"
          status: "pass: 77 tests"
        - cmd: "CI-env uv run pytest -q tests/integration/object_content/test_reference_fence.py"
          status: "pass: 5 PostgreSQL 13 integration tests"
      first_red: "An inline control row, inline payload, and first concrete reference cannot currently commit atomically because the common row requires an object key and the reverse backend ownership does not exist."

