# ============================================================================
# ENEO PRODUCTION DEPLOYMENT - Docker Compose Configuration
# ============================================================================
# Complete production stack with Traefik reverse proxy and Let's Encrypt SSL
#
# BEFORE DEPLOYING:
#   1. Replace "your-email@domain.com" with your email (1 line, marked CHANGE THIS)
#   2. Replace "your-domain.com" with your domain (4 lines, marked CHANGE THIS)
#   3. Configure environment files (env_backend.env, env_frontend.env, env_db.env)
#   4. Create external network: docker network create proxy_tier
#
# CUSTOMIZATION NOTE:
#   This is a reference configuration. Customize for your organization's
#   security requirements, network topology, and infrastructure needs.
#
# STARTUP ORDER (handled automatically via healthchecks):
#   1. db + redis start and become healthy
#   2. db-init runs migrations and creates default user
#   3. backend + worker start (only after db-init succeeds)
#   4. frontend starts
#
# VOLUME MANAGEMENT:
#   The "name: eneo" fixes the Compose project name regardless of which
#   directory you run commands from. Docker creates volumes with that project
#   prefix, for example eneo_eneo_postgres_data.
#   To completely reset: docker compose down -v && docker compose up -d
#
# NETWORK ISOLATION:
#   proxy_tier (external) - Traefik, frontend, backend, worker. Internet-facing
#                           traffic and outbound access (LLM APIs, OIDC, crawls).
#   data_net   (internal) - PostgreSQL and Redis. No internet egress, and only
#                           backend, worker and db-init can reach them. Frontend,
#                           Traefik and future module containers cannot.
#   module_net (internal) - Traefik and backend. Reserved for optional module
#                           containers. Modules get no internet egress; all
#                           their calls go to backend:8000, and user login is
#                           handed off from the Eneo session (SSO) rather than
#                           the module talking to an IdP itself.
#   tool_runtime_net (internal) - tool-runtime, backend and worker. The
#                           bundled tools runtime has no internet, database
#                           or Redis route (see TOOL_RUNTIME.md).
#   object_content_net (internal) - added by docker-compose.object-content.yml
#                           only for the optional bundled endpoint.
#   Backend is the single gateway between the outside world, the data layers,
#   optional object content, and modules.
#
# Full documentation: ../DEPLOYMENT.md
# ============================================================================

name: eneo

services:
  traefik:
    image: traefik:v3
    container_name: eneo_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=your-email@domain.com"  # CHANGE THIS
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # Default network for reaching routed containers. Services on multiple
      # networks (backend) would otherwise get a random - possibly unreachable -
      # network IP. Module containers override this with their own
      # traefik.docker.network label on eneo_module_net.
      - "--providers.docker.network=proxy_tier"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    networks:
      - proxy_tier
      - module_net
    labels:
      # IMPORTANT: traefik.enable=true is required for Traefik to read these labels
      # (because exposedbydefault=false is set above)
      - "traefik.enable=true"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  frontend:
    image: ${ENEO_FRONTEND_IMAGE:-ghcr.io/eneo-ai/eneo-frontend:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    container_name: eneo_frontend
    restart: unless-stopped
    env_file:
      - env_frontend.env
    networks:
      - proxy_tier
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eneo-frontend.rule=Host(`your-domain.com`)"  # CHANGE THIS
      - "traefik.http.routers.eneo-frontend.entrypoints=web"
      - "traefik.http.routers.eneo-frontend.middlewares=redirect-to-https"
      - "traefik.http.routers.eneo-frontend-secure.rule=Host(`your-domain.com`)"  # CHANGE THIS
      - "traefik.http.routers.eneo-frontend-secure.entrypoints=websecure"
      - "traefik.http.routers.eneo-frontend-secure.tls=true"
      - "traefik.http.routers.eneo-frontend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eneo-frontend-secure.service=eneo-frontend-svc"
      - "traefik.http.services.eneo-frontend-svc.loadbalancer.server.port=3000"
      - "traefik.http.routers.eneo-frontend-secure.priority=1"
    depends_on:
      - backend

  backend:
    image: ${ENEO_BACKEND_IMAGE:-ghcr.io/eneo-ai/eneo-backend:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    container_name: eneo_backend
    restart: unless-stopped
    environment:
      - TOOL_RUNTIME_URL=${TOOL_RUNTIME_URL:-http://tool-runtime:3010}
      - TOOL_RUNTIME_TOKEN=${TOOL_RUNTIME_TOKEN:-}
      - FILE_REFERENCE_BASE_URL=${FILE_REFERENCE_BASE_URL:-http://backend:8000}
      # List form passes these through only when the deployment .env defines
      # them. With every value absent, Eneo runs the PostgreSQL-inline backend.
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP
      - REDIS_PASSWORD
    env_file:
      - env_backend.env
    volumes:
      - eneo_backend_data:/app/data
      - eneo_temp_files:/tmp  # Also used for audit log exports (/tmp/exports)
    networks:
      - tool_runtime_net
      - proxy_tier
      - data_net
      - module_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.eneo-backend.rule=Host(`your-domain.com`) && (PathPrefix(`/api`) || PathPrefix(`/scim`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/version`))"  # CHANGE THIS
      - "traefik.http.routers.eneo-backend.entrypoints=web"
      - "traefik.http.routers.eneo-backend.middlewares=redirect-to-https"
      - "traefik.http.routers.eneo-backend-secure.rule=Host(`your-domain.com`) && (PathPrefix(`/api`) || PathPrefix(`/scim`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/version`))"  # CHANGE THIS
      - "traefik.http.routers.eneo-backend-secure.entrypoints=websecure"
      - "traefik.http.routers.eneo-backend-secure.tls=true"
      - "traefik.http.routers.eneo-backend-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.eneo-backend-secure.service=eneo-backend-svc"
      - "traefik.http.services.eneo-backend-svc.loadbalancer.server.port=8000"
      - "traefik.http.routers.eneo-backend-secure.priority=10"
    healthcheck:
      # Module containers (docker-compose.modules.yml) gate their startup on
      # this check. /api/healthz exists on released images too, where the
      # /api/readyz alias is not yet available; liveness stays at /api/livez.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/healthz', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully

  worker:
    # General background task processor (uploads, integrations, and control jobs)
    # Uses same image as backend but runs ARQ worker instead of HTTP server
    # The RUN_AS_WORKER env var tells run.sh to start ARQ instead of Gunicorn
    image: ${ENEO_BACKEND_IMAGE:-ghcr.io/eneo-ai/eneo-backend:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    container_name: eneo_worker
    init: true
    restart: unless-stopped
    environment:
      - TOOL_RUNTIME_URL=${TOOL_RUNTIME_URL:-http://tool-runtime:3010}
      - TOOL_RUNTIME_TOKEN=${TOOL_RUNTIME_TOKEN:-}
      - FILE_REFERENCE_BASE_URL=${FILE_REFERENCE_BASE_URL:-http://backend:8000}
      - RUN_AS_WORKER=true  # Runs today's ARQ adapter; task logic is queue-neutral
      - WORKER_ROLE=general
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP
      - REDIS_PASSWORD
    env_file:
      - env_backend.env
    volumes:
      - eneo_backend_data:/app/data
      - eneo_temp_files:/tmp  # Shared with backend for audit log exports (/tmp/exports)
    networks:
      - tool_runtime_net
      - proxy_tier
      - data_net
    depends_on:
      - backend

  crawler-worker:
    # Dedicated consumer for long-running website crawls on arq:crawler.
    image: ${ENEO_BACKEND_IMAGE:-ghcr.io/eneo-ai/eneo-backend:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    init: true
    restart: unless-stopped
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "arq", "--check", "src.eneo.worker.arq.CrawlerWorkerSettings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - RUN_AS_WORKER=true
      - WORKER_ROLE=crawler
      - OBJECT_CONTENT_ENDPOINT_URL
      - OBJECT_CONTENT_REGION
      - OBJECT_CONTENT_BUCKET
      - OBJECT_CONTENT_ACCESS_KEY_ID
      - OBJECT_CONTENT_SECRET_ACCESS_KEY
      - OBJECT_CONTENT_DEPLOYMENT_ID
      - OBJECT_CONTENT_ALLOW_INSECURE_HTTP
      - REDIS_PASSWORD
    env_file:
      - env_backend.env
    # Startup recovery requires /tmp to remain private to this crawler container.
    # eneo_temp_files contains upload and export staging, so do not mount it here.
    volumes:
      - eneo_backend_data:/app/data
    networks:
      - proxy_tier
      - data_net
    depends_on:
      - backend

  db:
    image: pgvector/pgvector:pg16
    container_name: eneo_db
    restart: unless-stopped
    env_file:
      - env_db.env
    volumes:
      - eneo_postgres_data:/var/lib/postgresql/data
    networks:
      - data_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eneo_redis
    restart: unless-stopped
    # Optional: define REDIS_PASSWORD in the deployment .env to require
    # authentication. The same value reaches backend and workers through their
    # pass-through lists; leave it undefined to run without a password.
    environment:
      - REDIS_PASSWORD
    command:
      - sh
      - -c
      - exec redis-server $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - eneo_redis_data:/data
    networks:
      - data_net
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5

  db-init:
    # Runs database migrations and creates default tenant/user on first startup
    # Only runs once - exits after completion (restart: "no")
    image: ${ENEO_BACKEND_IMAGE:-ghcr.io/eneo-ai/eneo-backend:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    container_name: eneo_db_init
    command: ["python", "init_db.py"]
    environment:
      - REDIS_PASSWORD
    env_file:
      - env_backend.env
    networks:
      - data_net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  tool-runtime:
    image: ${ENEO_TOOL_RUNTIME_IMAGE:-ghcr.io/eneo-ai/eneo-tool-runtime:${ENEO_VERSION:?Select one Eneo release or use release.env}}
    restart: unless-stopped
    environment:
      TOOL_RUNTIME_TOKEN: ${TOOL_RUNTIME_TOKEN:-}
      MAX_QUEUE: ${TOOL_RUNTIME_MAX_QUEUE:-32}
      MAX_QUEUE_PER_GROUP: ${TOOL_RUNTIME_MAX_QUEUE_PER_GROUP:-8}
      TABULAR_CACHE_MB: ${TOOL_RUNTIME_TABULAR_CACHE_MB:-256}
      MAX_CONCURRENCY: ${TOOL_RUNTIME_MAX_CONCURRENCY:-16}
      # File analysis fetches attachments from the origin Eneo sends with
      # each call (its FILE_REFERENCE_BASE_URL). Optionally pin it here as
      # well; a mismatch then fails the call instead of fetching.
      TOOL_RUNTIME_FILE_ORIGINS: ${TOOL_RUNTIME_FILE_ORIGINS:-${FILE_REFERENCE_BASE_URL:-http://backend:8000}}
      TABULAR_CONCURRENCY: ${TOOL_RUNTIME_TABULAR_CONCURRENCY:-2}
      # How long parsed sheets (plaintext) stay in /tmp for follow-up
      # questions. Lower it, down to 60, where files are sensitive.
      TABULAR_CACHE_TTL_SECONDS: ${TOOL_RUNTIME_TABULAR_CACHE_TTL_SECONDS:-1800}
      # Each job runs confined with Landlock where the host kernel offers it
      # (Linux 5.13 or later). Set true to refuse to start, and to run any
      # job, on a host that cannot confine them.
      TOOL_RUNTIME_REQUIRE_CONFINEMENT: ${TOOL_RUNTIME_REQUIRE_CONFINEMENT:-false}
      # Name shown in the footer of generated documents.
      DOCUMENT_ORGANISATION_NAME: ${TOOL_RUNTIME_DOCUMENT_ORGANISATION_NAME:-}
    # The parent can reach Eneo for signed downloads; children have no network.
    # This network gives the runtime no internet, database, or Redis route.
    networks:
      - tool_runtime_net
    expose:
      - "3010"
    read_only: true
    # Job scratch space plus the parsed-sheet cache (256 MiB by default).
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2

networks:
  tool_runtime_net:
    driver: bridge
    internal: true
  proxy_tier:
    external: true
  data_net:
    driver: bridge
    internal: true  # no internet egress; unreachable from Traefik/frontend/modules
  module_net:
    driver: bridge
    internal: true  # modules have no internet egress; ingress arrives via Traefik
volumes:
  eneo_postgres_data:
  eneo_redis_data:
  eneo_backend_data:
  traefik_letsencrypt:
  eneo_temp_files:  # Also stores audit log exports (/tmp/exports, auto-cleaned after 24h)
