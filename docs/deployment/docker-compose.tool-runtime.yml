# Optional bundled tool runtime: isolated MCP tools (compute, charts, file
# analysis and file creation) that Eneo registers through Admin -> Tools.
#
# Compose this file with docker-compose.yml and enable the tool-runtime profile
# after setting ENEO_TOOL_RUNTIME_IMAGE (an immutable digest) and
# TOOL_RUNTIME_TOKEN in .env. That one token is handed to the runtime, the
# backend and the worker below, together with the runtime URL, so nothing
# goes into env_backend.env and the two sides cannot disagree. See
# TOOL_RUNTIME.md.

x-tool-runtime-client: &tool-runtime-client
  # Overrides any TOOL_RUNTIME_* in env_backend.env: this file is the one
  # place the bundled runtime is configured.
  - TOOL_RUNTIME_URL=http://tool-runtime:3010
  - TOOL_RUNTIME_TOKEN=${TOOL_RUNTIME_TOKEN:?Set TOOL_RUNTIME_TOKEN in .env (openssl rand -hex 32)}

services:
  backend:
    environment: *tool-runtime-client
    networks:
      - tool_runtime_net

  worker:
    environment: *tool-runtime-client
    networks:
      - tool_runtime_net

  tool-runtime:
    profiles:
      - tool-runtime
    image: ${ENEO_TOOL_RUNTIME_IMAGE:?Set the verified ghcr.io/eneo-ai/eneo-tool-runtime digest in .env}
    restart: unless-stopped
    environment:
      TOOL_RUNTIME_TOKEN: ${TOOL_RUNTIME_TOKEN:?Set TOOL_RUNTIME_TOKEN in .env (openssl rand -hex 32)}
      MAX_CONCURRENCY: ${TOOL_RUNTIME_MAX_CONCURRENCY:-16}
      # File analysis fetches attachments from the origin Eneo sends with
      # each call (its FILE_REFERENCE_BASE_URL). Optionally pin it here as
      # well; a mismatch then fails the call instead of fetching.
      TOOL_RUNTIME_FILE_ORIGINS: ${TOOL_RUNTIME_FILE_ORIGINS:-}
      TABULAR_CONCURRENCY: ${TOOL_RUNTIME_TABULAR_CONCURRENCY:-2}
      # How long parsed sheets (plaintext) stay in /tmp for follow-up
      # questions. Lower it, down to 60, where files are sensitive.
      TABULAR_CACHE_TTL_SECONDS: ${TOOL_RUNTIME_TABULAR_CACHE_TTL_SECONDS:-1800}
      # Each job runs confined with Landlock where the host kernel offers it
      # (Linux 5.13 or later). Set true to refuse to start, and to run any
      # job, on a host that cannot confine them.
      TOOL_RUNTIME_REQUIRE_CONFINEMENT: ${TOOL_RUNTIME_REQUIRE_CONFINEMENT:-false}
      # Name shown in the footer of generated documents.
      DOCUMENT_ORGANISATION_NAME: ${TOOL_RUNTIME_DOCUMENT_ORGANISATION_NAME:-}
    # Only the backend can reach the runtime, and the runtime can reach nothing:
    # the network is internal, so guest code has no route out even if it
    # escaped the WebAssembly engine and the sandbox child.
    networks:
      - tool_runtime_net
    expose:
      - "3010"
    read_only: true
    # Job scratch space plus the parsed-sheet cache (256 MiB by default).
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2

networks:
  tool_runtime_net:
    driver: bridge
    internal: true
