# Optional Vite UI on the existing backend. Svelte keeps its service and host.
# Set WEB_NEXT_HOST in .env and configure runtime/federation in env_backend.env.
# docker compose --env-file .env --env-file release.env \
#   -f docker-compose.yml -f docker-compose.web-next.yml up -d
services:
  backend:
    environment:
      WEB_APP_ENABLED: "true"
      BROWSER_SESSION_ENABLED: "true"
    labels:
      - traefik.http.routers.eneo-web-next.rule=Host(`${WEB_NEXT_HOST:?Set the Vite hostname}`) && !(Path(`/internal-mcp`) || PathPrefix(`/internal-mcp/`))
      - traefik.http.routers.eneo-web-next.entrypoints=web
      - traefik.http.routers.eneo-web-next.middlewares=redirect-to-https
      - traefik.http.routers.eneo-web-next.service=eneo-backend-svc
      - traefik.http.routers.eneo-web-next.priority=20
      - traefik.http.routers.eneo-web-next-secure.rule=Host(`${WEB_NEXT_HOST:?Set the Vite hostname}`) && !(Path(`/internal-mcp`) || PathPrefix(`/internal-mcp/`))
      - traefik.http.routers.eneo-web-next-secure.entrypoints=websecure
      - traefik.http.routers.eneo-web-next-secure.tls=true
      - traefik.http.routers.eneo-web-next-secure.tls.certresolver=letsencrypt
      - traefik.http.routers.eneo-web-next-secure.service=eneo-backend-svc
      - traefik.http.routers.eneo-web-next-secure.priority=20
